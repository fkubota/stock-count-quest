<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在庫カウントクエスト</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0f16; color: #cfd4e0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  }
  #wrap {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px;
  }
  canvas {
    width: 100%; max-width: 960px; aspect-ratio: 16 / 9;
    background: #11131c;
    border: 2px solid #2a2f40; border-radius: 4px;
    image-rendering: pixelated;
    outline: none;
  }
  #hint {
    max-width: 960px; width: 100%;
    margin: 0; font-size: 13px; line-height: 1.7; color: #6f7788;
  }
  #hint b { color: #9aa3b6; font-weight: 600; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="g" width="960" height="540" tabindex="0"></canvas>
  <p id="hint">
    <b>そうさ</b> ↑↓←→ いどう ／ Z しらべる・あける ／ X もどる ／ Enter かくてい<br>
    画面をクリックしてからキーを押してください。数は<b>自分の目で数えて、自分で覚えて</b>ください。
  </p>
</div>

<script>
"use strict";
/* =========================================================================
   在庫カウントクエスト / STOCK COUNT QUEST

   飲食店の在庫カウントが、なぜめんどくさいのかを体験するゲーム。

   設計の軸:
   - 何を数えるのかは「パソコンの前」でしか分からない
   - どこに何があるかは教えない。自分で開けて探す
   - 数える補助は一切ない。目で見て、自分の頭で覚えて、歩いて入力しに行く

   方針:
   - 外部依存ゼロ。CDNもfetchも外部画像も使わない（file:// でも動く）
   - 背景とオブジェクトはドット絵（アート座標を3倍して矩形で塗る）
   - 文字はCanvasに普通のフォントでくっきり描く
   ========================================================================= */

/* ---------------------------------------------------------------- 基本 */
const cv = document.getElementById("g");
const ctx = cv.getContext("2d");

const S = 3;                  // ドット1個 = 3実ピクセル
const AW = 320, AH = 180;     // アート座標系
const W = AW * S, H = AH * S; // 960 x 540

const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif';

// 業務システムらしく見せるための配色
const C = {
  white:  "#ffffff",
  sumi:   { 50:"#f7f7f7", 100:"#e8e8e8", 200:"#d4d4d4", 300:"#bababa",
            400:"#a1a1a1", 500:"#868686", 600:"#6f6f6f", 700:"#585858",
            800:"#414141", 900:"#1b1b1b" },
  wasabi: { 50:"#f0fcfa", 300:"#82dad0", 500:"#16a595", 600:"#008f76", 700:"#006e5c" },
  mikan:  { 50:"#fff9f0", 100:"#fff0d6", 300:"#fcc862", 400:"#f5a820", 500:"#e88c00", 700:"#a85800" },
  tarako: { 50:"#fff4f2", 100:"#feebe8", 300:"#f9a49c", 500:"#e84040", 600:"#d02424", 700:"#ae1a1a" },
  floorA: "#606876", floorB: "#545c6a", floorLn: "#424856",
  wall:   "#363a4a", wallHi: "#484e60", wallLo: "#262934",
  steel:  "#aab2be", steelHi: "#ced4de", steelLo: "#7a8290",
  wood:   "#966c42", woodLo: "#745230",
  uiFg:   "#ecf0f8",
};

/* ---- 描画ヘルパ ---- */
function pr(x, y, w, h, col) { // アート座標の矩形（ドット絵用）
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x) * S, Math.round(y) * S, Math.round(w) * S, Math.round(h) * S);
}
function rr(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function ro(x, y, w, h, col, t) {
  t = t || 2; ctx.strokeStyle = col; ctx.lineWidth = t;
  ctx.strokeRect(x + t / 2, y + t / 2, w - t, h - t);
}
function txt(s, x, y, o) {
  o = o || {};
  const size = o.size || 16;
  ctx.font = (o.bold ? "bold " : "") + size + "px " + FONT;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "top";
  ctx.fillStyle = o.color || C.uiFg;
  ctx.fillText(s, x, y);
}
function tw(s, size, bold) {
  ctx.font = (bold ? "bold " : "") + (size || 16) + "px " + FONT;
  return ctx.measureText(s).width;
}
function stamp(x, y, rows, pal) {
  for (let j = 0; j < rows.length; j++) {
    for (let i = 0; i < rows[j].length; i++) {
      const ch = rows[j][i];
      if (ch === ".") continue;
      pr(x + i, y + j, 1, 1, pal[ch]);
    }
  }
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------------------------------------------------------- スプライト */
const CHEF_PAL = { H:"#f8f8fc", S:"#e8ba96", K:"#20202c", M:"#c48670",
                   C:"#f0f2f8", A:"#5c94d6", B:"#3a3e52", N:"#222430" };
const CHEF_FRONT = [
  "...HHHHHH...", "..HHHHHHHH..", ".HHHHHHHHHH.",
  "..SSSSSSSS..", "..SKSSSSKS..", "..SSSSSSSS..", "...SMMMMS...",
  "..CCCCCCCC..", ".CCCAAAACCC.", "SCCCAAAACCCS", "SCCCAAAACCCS",
  ".CCCAAAACCC.", "..CCAAAACC..", "...BB..BB...", "...BB..BB...", "..NNN..NNN..",
];
const CHEF_BACK = [
  "...HHHHHH...", "..HHHHHHHH..", ".HHHHHHHHHH.",
  "..SSSSSSSS..", "..SSSSSSSS..", "..SSSSSSSS..", "...SSSSSS...",
  "..CCCCCCCC..", ".CCCCCCCCCC.", "SCCCCCCCCCCS", "SCCCCCCCCCCS",
  ".CCCCCCCCCC.", "..CCCCCCCC..", "...BB..BB...", "...BB..BB...", "..NNN..NNN..",
];

/* ---------------------------------------------------------------- セーブ */
const SAVE_KEY = "stock-count-quest/v1";
let storageOK = true;

function todayStr(d) {
  d = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const defaultSave = () => ({ lastPlayedDate: null, streak: 0, totalCounted: 0, days: [] });
function probeStorage() {
  try {
    localStorage.setItem(SAVE_KEY + "/probe", "1");
    localStorage.removeItem(SAVE_KEY + "/probe");
    return true;
  } catch (e) { return false; }
}
function loadSave() {
  storageOK = probeStorage();
  if (!storageOK) return defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? Object.assign(defaultSave(), JSON.parse(raw)) : defaultSave();
  } catch (e) { return defaultSave(); }
}
function writeSave() {
  if (!storageOK) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) { storageOK = false; }
}

/* ---------------------------------------------------------------- データ
   どこに何があるかはプレイヤーには知らせない。
   place はゲーム内部の配置情報であって、画面には一切出さない。

   theo はシステムが持っている理論在庫（わざとズレている。これが物語の起点）
   delivery は「本日納品予定」。まだ箱のままなので目には入らないが、
   これも足して入力しないと正解にならない。
*/
const INGREDIENTS = [
  { id:"pork", name:"ぶたバラ肉", unit:"袋", color:"#e8a294",
    place:"fridge", kind:"pieces", pieces:11,
    theo:22, delivery:2, reason:"定期カウント" },

  { id:"oil", name:"サラダ油", unit:"L", color:"#ecc85e",
    place:"fridge", kind:"liquid", canSize:4, cans:[1, 1, 0.5, 1],
    theo:4, delivery:0, reason:"在庫がマイナス" },

  { id:"wakame", name:"かんそうわかめ", unit:"袋", color:"#8fae84",
    place:"shelf", kind:"boxes", boxes:[6, 0, 4, 3],
    theo:13, delivery:0, reason:"初回カウント" },
];

// 正解（＝入力すべき値）
function expectedOf(ing) {
  let base = 0;
  if (ing.kind === "pieces") base = ing.pieces;
  if (ing.kind === "liquid") base = ing.cans.reduce((a, b) => a + b, 0) * ing.canSize;
  if (ing.kind === "boxes")  base = ing.boxes.reduce((a, b) => a + b, 0);
  return base + ing.delivery;
}

/* ---------------------------------------------------------------- 状態 */
const G = { scene: "title", save: null, day: null, t: 0 };

function newDay() {
  return {
    inputs: {},       // id -> 入力値
    touched: {},      // id -> 一度でも値を動かしたか
    confirmed: {},    // id -> 在庫確定したか
    openedBoxes: {},  // "wakame:2" -> true（開けた箱）
    seenList: false,  // 一度でもパソコンで依頼を見たか
    skips: 0,
    walked: 0,
    startedAt: Date.now(),
  };
}
const remaining = () => INGREDIENTS.filter(i => !G.day.confirmed[i.id]).length;

/* ---------------------------------------------------------------- 入力 */
const held = Object.create(null);
const EAT = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter"];
window.addEventListener("keydown", e => {
  if (EAT.indexOf(e.key) >= 0) e.preventDefault();
  if (!held[e.key]) onKey(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  held[e.key] = true;
});
window.addEventListener("keyup", e => { held[e.key] = false; });
cv.addEventListener("mousedown", () => cv.focus());
const k = n => !!held[n];

/* ---------------------------------------------------------------- 厨房 */
const ROOM = {
  floorTop: 58, floorBottom: 172,
  objects: [
    { id:"fridge", label:"れいぞうこ",   prompt:"あける",   x:40,  y:14, w:30, h:44, zone:{ x:36,  y:58, w:38, h:18 } },
    { id:"shelf",  label:"じょうおんだな", prompt:"しらべる", x:120, y:18, w:72, h:40, zone:{ x:118, y:58, w:76, h:18 } },
    { id:"pc",     label:"パソコン",     prompt:"つかう",   x:244, y:24, w:50, h:34, zone:{ x:242, y:58, w:54, h:18 } },
  ],
};
const player = { x: 152, y: 112, dir: "up" };

function nearObject() {
  for (const o of ROOM.objects) {
    const z = o.zone;
    if (player.x + 5 >= z.x && player.x + 5 <= z.x + z.w &&
        player.y + 14 >= z.y && player.y + 14 <= z.y + z.h + 10) return o;
  }
  return null;
}
function updateKitchen(dt) {
  const sp = 54 * dt;
  let dx = 0, dy = 0;
  if (k("ArrowLeft"))  { dx -= sp; player.dir = "left"; }
  if (k("ArrowRight")) { dx += sp; player.dir = "right"; }
  if (k("ArrowUp"))    { dy -= sp; player.dir = "up"; }
  if (k("ArrowDown"))  { dy += sp; player.dir = "down"; }
  if (dx || dy) {
    const nx = clamp(player.x + dx, 6, AW - 16);
    const ny = clamp(player.y + dy, ROOM.floorTop + 4, ROOM.floorBottom - 16);
    G.day.walked += Math.abs(nx - player.x) + Math.abs(ny - player.y);
    player.x = nx; player.y = ny;
  }
}

/* ---------------------------------------------------------------- パソコン */
function openPC() {
  for (const ing of INGREDIENTS) {
    if (G.day.inputs[ing.id] === undefined) G.day.inputs[ing.id] = ing.theo;
  }
  G.day.seenList = true;   // ここで初めて「何を数えるか」が分かる
  G.pc = { row: 0, dialog: null };
  G.scene = "pc";
}
// 入力値が理論在庫から離れすぎていないかを見る。
// 業務システムによくある「想定と違いますよ」の警告をイメージしている。
function warnsAt(v, theo) {
  if (v === 0 && theo > 0) return "在庫数が0になっています";
  if (v > theo * 1.5 || v < theo / 1.6) return "想定在庫から大きく離れます";
  return null;
}
function confirmRow(ing) {
  G.day.confirmed[ing.id] = true;
  if (!G.day.touched[ing.id]) G.day.skips++; // 未編集のまま確定＝スキップ
  if (remaining() === 0) finishDay();
}

/* ---------------------------------------------------------------- 結果 */
function finishDay() {
  let errSum = 0;
  for (const ing of INGREDIENTS) {
    const exp = expectedOf(ing);
    errSum += Math.abs((G.day.inputs[ing.id] || 0) - exp) / exp;
  }
  const n = INGREDIENTS.length;
  const accuracy = Math.max(0, Math.round((1 - errSum / n) * 100));
  const skipRate = Math.round((G.day.skips / n) * 1000) / 10;
  const seconds = Math.round((Date.now() - G.day.startedAt) / 1000);
  const rank = (accuracy >= 95 && G.day.skips === 0) ? "S"
             : accuracy >= 80 ? "A" : accuracy >= 55 ? "B" : "C";

  G.result = {
    accuracy, skipRate, seconds, rank, items: n,
    walked: Math.round(G.day.walked),
    detail: INGREDIENTS.map(ing => ({
      name: ing.name, unit: ing.unit,
      input: G.day.inputs[ing.id] || 0, expected: expectedOf(ing),
    })),
  };

  const today = todayStr();
  const prev = G.save.lastPlayedDate;
  if (prev !== today) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    G.save.streak = (prev === todayStr(y)) ? G.save.streak + 1 : 1;
  }
  G.save.lastPlayedDate = today;
  G.save.totalCounted += n;
  G.save.days.unshift({ date: today, accuracy, skipRate, seconds, rank });
  G.save.days = G.save.days.slice(0, 30);
  writeSave();

  G.scene = "result";
}

/* =========================================================================
   キー入力
   ========================================================================= */
function onKey(key) {
  switch (G.scene) {

    case "title":
      if (key === "Enter" || key === "z") G.scene = "briefing";
      return;

    case "briefing":
      if (key === "Enter" || key === "z") {
        G.day = newDay();
        player.x = 152; player.y = 112; player.dir = "up";
        G.scene = "kitchen";
      }
      return;

    case "kitchen": {
      if (key !== "z") return;
      const o = nearObject();
      if (!o) return;
      if (o.id === "fridge") G.scene = "fridge";
      if (o.id === "shelf")  { G.shelf = { cursor: 0 }; G.scene = "shelf"; }
      if (o.id === "pc")     openPC();
      return;
    }

    case "fridge":
      if (key === "x" || key === "z" || key === "Escape") G.scene = "kitchen";
      return;

    case "shelf": {
      const ing = INGREDIENTS.find(i => i.place === "shelf");
      const s = G.shelf;
      if (key === "x" || key === "Escape") { G.scene = "kitchen"; return; }
      if (key === "ArrowLeft")  s.cursor = clamp(s.cursor - 1, 0, ing.boxes.length - 1);
      if (key === "ArrowRight") s.cursor = clamp(s.cursor + 1, 0, ing.boxes.length - 1);
      if (key === "z") {
        const bk = ing.id + ":" + s.cursor;
        G.day.openedBoxes[bk] = !G.day.openedBoxes[bk];
      }
      return;
    }

    case "pc": {
      const p = G.pc;
      if (p.dialog) {
        const d = p.dialog;
        if (key === "ArrowLeft")  d.choice = 0;
        if (key === "ArrowRight") d.choice = 1;
        if (key === "Enter" || key === "z") {
          if (d.choice === 0) { p.dialog = null; G.scene = "kitchen"; } // 数えなおしに戻る
          else { p.dialog = null; confirmRow(d.ing); }
        }
        return;
      }
      if (key === "x" || key === "Escape") { G.scene = "kitchen"; return; }
      if (key === "ArrowUp")   p.row = (p.row + INGREDIENTS.length - 1) % INGREDIENTS.length;
      if (key === "ArrowDown") p.row = (p.row + 1) % INGREDIENTS.length;

      const ing = INGREDIENTS[p.row];
      if (key === "ArrowLeft" || key === "ArrowRight") {
        G.day.confirmed[ing.id] = false; // 確定済みでも再編集できる
        const d = (key === "ArrowLeft") ? -1 : 1;
        G.day.inputs[ing.id] = Math.max(0, (G.day.inputs[ing.id] || 0) + d);
        G.day.touched[ing.id] = true;
      }
      if ((key === "Enter" || key === "z") && !G.day.confirmed[ing.id]) {
        const msg = warnsAt(G.day.inputs[ing.id], ing.theo);
        if (msg) p.dialog = { ing, msg, choice: 0 };
        else confirmRow(ing);
      }
      return;
    }

    case "result":
      if (key === "Enter" || key === "z") G.scene = "title";
      return;
  }
}

/* =========================================================================
   描画 ― 部屋
   ========================================================================= */
function drawFloor(y0, y1) {
  for (let ty = Math.floor(y0 / 16) * 16; ty < y1; ty += 16) {
    for (let tx = 0; tx < AW; tx += 16) {
      const yy = Math.max(ty, y0);
      pr(tx, yy, 16, Math.min(16, y1 - yy),
         ((tx / 16 + ty / 16) % 2 === 0) ? C.floorA : C.floorB);
    }
  }
  for (let ty = Math.ceil(y0 / 16) * 16; ty < y1; ty += 16) pr(0, ty, AW, 1, C.floorLn);
  for (let tx = 0; tx < AW; tx += 16) pr(tx, y0, 1, y1 - y0, C.floorLn);
}
function drawWall(y0, y1) {
  pr(0, y0, AW, y1 - y0, C.wall);
  for (let x = 0; x < AW; x += 24) pr(x, y0, 1, y1 - y0 - 3, C.wallLo);
  pr(0, y1 - 3, AW, 1, C.wallLo);
  pr(0, y1 - 2, AW, 2, C.wallHi);
}
function drawFridgeBody(x, y, w, h) {
  pr(x, y, w, h, C.steelLo);
  pr(x + 1, y + 1, w - 2, h - 3, C.steel);
  pr(x + 2, y + 2, w - 4, 2, C.steelHi);
  pr(x, y + 16, w, 1, C.steelLo);
  pr(x + w - 6, y + 5, 2, 8, "#464c5c");
  pr(x + w - 6, y + 22, 2, 15, "#464c5c");
  pr(x, y + h - 2, w, 2, "#282c3a");
}
function drawShelfBody(x, y, w, h) {
  pr(x, y, w, h, C.woodLo);
  pr(x + 1, y + 1, w - 2, h - 2, C.wood);
  const th = Math.floor(h / 3);
  for (let i = 1; i < 3; i++) pr(x + 1, y + i * th, w - 2, 2, C.woodLo);
  // 中身は閉じた箱。外からは何が入っているか分からない
  for (let r = 0; r < 3; r++) {
    for (let i = 0; i < 4; i++) {
      pr(x + 4 + i * 17, y + 3 + r * th, 14, th - 5, "#b08c5e");
      pr(x + 4 + i * 17, y + 3 + r * th, 14, 1, "#d6b488");
    }
  }
}
function drawDesk(x, y, w, h) {
  pr(x, y + h - 12, w, 4, C.wood);
  pr(x + 2, y + h - 8, 3, 8, C.woodLo);
  pr(x + w - 5, y + h - 8, 3, 8, C.woodLo);
  pr(x + 10, y, w - 20, h - 12, "#383c4c");
  pr(x + 12, y + 2, w - 24, h - 17, "#12605c");
  for (let i = 0; i < 3; i++) pr(x + 15, y + 5 + i * 4, 16 - i * 3, 2, C.wasabi[300]);
}
function drawPlayer() {
  pr(player.x - 1, player.y + 15, 12, 2, "rgba(0,0,0,0.35)");
  stamp(Math.round(player.x), Math.round(player.y),
        player.dir === "up" ? CHEF_BACK : CHEF_FRONT, CHEF_PAL);
}

/* ---- 共通UI ---- */
function drawHUD() {
  rr(0, 0, W, 34, "#0e1018");
  rr(0, 34, W, 2, "#000");
  txt("のこり", 14, 9, { size: 15, color: C.sumi[400] });
  // パソコンで依頼を見るまでは、何件あるのかも分からない
  txt(G.day.seenList ? String(remaining()) : "？", 68, 5,
      { size: 20, color: C.mikan[300], bold: true });
  txt("件", G.day.seenList ? 92 : 90, 9, { size: 15, color: C.sumi[400] });

  const sec = Math.floor((Date.now() - G.day.startedAt) / 1000);
  txt("じかん", 150, 9, { size: 15, color: C.sumi[400] });
  txt(String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0"),
      206, 7, { size: 17, color: C.white, bold: true });

  txt("数えた数は 自分で おぼえておくこと", W - 14, 9,
      { size: 14, color: C.sumi[500], align: "right" });
}
function drawPrompt(text, cx, cy) {
  const w = tw(text, 15, true) + 24;
  rr(cx - w / 2, cy, w, 28, "#0c0e16");
  ro(cx - w / 2, cy, w, 28, C.mikan[300], 2);
  txt(text, cx, cy + 6, { size: 15, color: C.mikan[300], bold: true, align: "center" });
}
function drawMessageBox(lines, accent) {
  const h = 30 + lines.length * 26;
  const y = H - h - 46;
  rr(24, y, W - 48, h, "#0c0e16");
  ro(24, y, W - 48, h, C.white, 2);
  ro(30, y + 6, W - 60, h - 12, "#3c4254", 2);
  lines.forEach((s, i) =>
    txt(s, 48, y + 18 + i * 26, { size: 17, color: (accent && i === 0) ? accent : C.uiFg }));
}
function drawKeyHints(items, y) {
  let x = 20;
  for (const [key, label] of items) {
    const kw = tw(key, 14, true) + 16;
    rr(x, y, kw, 22, C.sumi[100]);
    ro(x, y, kw, 22, C.sumi[500], 2);
    txt(key, x + kw / 2, y + 4, { size: 14, color: C.sumi[900], bold: true, align: "center" });
    txt(label, x + kw + 8, y + 4, { size: 14, color: C.sumi[400] });
    x += kw + 12 + tw(label, 14) + 18;
  }
}

/* ---- 01 タイトル ---- */
function drawTitle() {
  rr(0, 0, W, H, "#10121c");
  for (let i = 0; i < AW; i += 9) {
    const hh = 40 + Math.round(18 * Math.sin(i * 0.11)) + ((i / 9) % 3 === 0 ? 12 : 0);

/* ---- 04 冷蔵庫の中（目で数える。補助はなし） ---- */
function drawFridgeScene() {
  rr(0, 0, W, H, "#0f1118");

  const bx = 90, by = 86, bw = W - 180, bh = 250;
  rr(bx - 14, by - 14, bw + 28, bh + 28, C.steelLo);
  rr(bx - 8, by - 8, bw + 16, bh + 16, "#c2c8d2");
  rr(bx, by, bw, bh, "#1b242e");
  ro(bx, by, bw, bh, "#10141c", 3);
  for (let i = 0; i < 40; i++) {
    rr(bx + 3, by + 3 + i, bw - 6, 1, "rgba(130,190,210," + (0.10 - i * 0.0024) + ")");
  }
  txt("れいぞうこ の なか", W / 2, 44, { size: 19, color: C.wasabi[300], bold: true, align: "center" });

  const oil  = INGREDIENTS.find(i => i.id === "oil");
  const pork = INGREDIENTS.find(i => i.id === "pork");

  // --- 上の段: 液体。容量が書かれた容器が並ぶ。中身はバラバラ ---
  const shelfY1 = by + 136;
  rr(bx + 8, shelfY1, bw - 16, 8, C.steelLo);
  rr(bx + 8, shelfY1, bw - 16, 3, C.steelHi);
  txt(oil.name, bx + 20, by + 12, { size: 17, color: C.sumi[300] });
  oil.cans.forEach((fill, i) => {
    drawCan(bx + 60 + i * 130, shelfY1 - 104, 76, 104, fill, oil.canSize);
  });

  // --- 下の段: 個数もの。わざと不ぞろいに置く ---
  const shelfY2 = by + bh - 20;
  rr(bx + 8, shelfY2, bw - 16, 8, C.steelLo);
  rr(bx + 8, shelfY2, bw - 16, 3, C.steelHi);
  txt(pork.name, bx + 20, shelfY2 - 82, { size: 17, color: C.sumi[300] });
  const layout = [ // [横のずれ, 縦のずれ] 目視での数えにくさを作る
    [0,0],[44,4],[82,0],[118,7],[158,2],[196,5],[232,0],[270,6],[306,1],[344,4],[382,0]];
  for (let i = 0; i < pork.pieces; i++) {
    const o = layout[i % layout.length];
    drawBag(bx + 34 + o[0], shelfY2 - 58 + o[1], 40, 58, pork.color);
  }

  drawMessageBox(["数える 道具は ない。目で 数えて、自分で おぼえること。"], C.mikan[300]);
  drawKeyHints([["X", "とじる"]], H - 40);
}
function drawCan(x, y, w, h, fill, size) {
  rr(x + w / 2 - 12, y - 10, 24, 10, "#848c9c");       // キャップ
  rr(x, y, w, h, "#b6bcc6");
  rr(x + 3, y + 3, w - 6, h - 6, "#98a0ac");
  const fh = Math.round((h - 12) * fill);
  rr(x + 6, y + h - 6 - fh, w - 12, fh, "#ecc85e");    // 中身
  rr(x + 6, y + h - 6 - fh, w - 12, 3, "#fae2a0");
  ro(x, y, w, h, "#5e646e", 3);
  for (let i = 1; i < 4; i++) rr(x + w - 13, y + 8 + (h - 16) * i / 4, 8, 2, "#6e747e");
  // 容量ラベル（容器そのものに書いてある）
  rr(x + 10, y + 14, w - 20, 26, "#f4f2ea");
  ro(x + 10, y + 14, w - 20, 26, "#9aa0a8", 2);
  txt(size + "L", x + w / 2, y + 19, { size: 17, color: "#2c2c30", bold: true, align: "center" });
}
function drawBag(x, y, w, h, col) {
  rr(x, y, w, h, col);
  rr(x, y, w, 7, "#ffffffcc");
  ro(x, y, w, h, "#00000055", 2);
  rr(x + 8, y + 22, w - 16, 12, "#fdfdfd");
}

/* ---- 05 常温だな（箱をあけないと中身が見えない） ---- */
function drawShelfScene() {
  const ing = INGREDIENTS.find(i => i.place === "shelf");
  rr(0, 0, W, H, "#171a24");

  const bx = 60, by = 86, bw = W - 120, bh = 230;
  rr(bx - 10, by - 10, bw + 20, bh + 20, C.woodLo);
  rr(bx, by, bw, bh, "#6b4e30");
  ro(bx, by, bw, bh, "#3e2c1a", 3);
  rr(bx + 6, by + bh - 16, bw - 12, 10, C.woodLo);

  txt("じょうおんだな", W / 2, 44, { size: 19, color: C.mikan[300], bold: true, align: "center" });

  const n = ing.boxes.length, bwid = 150, gap = 26;
  const startX = bx + (bw - (n * bwid + (n - 1) * gap)) / 2;
  for (let i = 0; i < n; i++) {
    const x = startX + i * (bwid + gap), y = by + 56;
    drawBox(x, y, bwid, 146, !!G.day.openedBoxes[ing.id + ":" + i], ing.boxes[i], ing.color, ing.name);
    if (i === G.shelf.cursor) {
      ro(x - 6, y - 26, bwid + 12, 178, C.mikan[300], 3);
      ctx.fillStyle = C.mikan[300];
      ctx.beginPath();
      ctx.moveTo(x + bwid / 2 - 10, y - 42);
      ctx.lineTo(x + bwid / 2 + 10, y - 42);
      ctx.lineTo(x + bwid / 2, y - 30);
      ctx.closePath(); ctx.fill();
    }
  }

  let opened = 0;
  for (let i = 0; i < n; i++) if (G.day.openedBoxes[ing.id + ":" + i]) opened++;
  drawMessageBox(
    opened === 0
      ? ["箱が ならんでいる。あけてみないと 中身は わからない。"]
      : ["あけた箱: " + opened + " / " + n + "。からっぽの 箱も ある。"],
    C.mikan[300]);
  drawKeyHints([["←→", "えらぶ"], ["Z", "あける／しめる"], ["X", "とじる"]], H - 40);
}
function drawBox(x, y, w, h, open, contents, col, name) {
  if (!open) {
    rr(x, y, w, h, "#b08c5e");
    rr(x + 2, y + 2, w - 4, h - 4, "#c89c6a");
    rr(x, y, w, 10, "#9a7a50");
    rr(x + w / 2 - 1, y + 10, 2, h - 10, "#a8864e");    // ふたの合わせ目
    rr(x + 18, y + h / 2 - 15, w - 36, 30, "#eee4d0");  // 貼り紙
    txt(name, x + w / 2, y + h / 2 - 8, { size: 13, color: "#4a4038", align: "center" });
    txt("とじている", x + w / 2, y + h + 8, { size: 14, color: C.sumi[500], align: "center" });
  } else {
    rr(x - 8, y - 16, w / 2 + 6, 18, "#9a7a50");        // 開いたふた
    rr(x + w / 2 + 2, y - 16, w / 2 + 6, 18, "#9a7a50");
    rr(x, y, w, h, "#8a6a44");
    rr(x + 6, y + 6, w - 12, h - 12, "#2e2518");        // 箱の中（暗い）
    if (contents === 0) {
      txt("からっぽ", x + w / 2, y + h / 2 - 10, { size: 18, color: C.sumi[500], align: "center" });
    } else {
      for (let i = 0; i < contents; i++) {           // きれいには並べない
        const r = Math.floor(i / 3), c = i % 3;
        const px = x + 14 + c * 42 + (r % 2 ? 7 : 0);
        const py = y + h - 36 - r * 32;
        rr(px, py, 36, 28, col);
        rr(px, py, 36, 4, "#ffffffbb");
        ro(px, py, 36, 28, "#00000055", 2);
      }
    }
    txt("あけた", x + w / 2, y + h + 8, { size: 14, color: C.wasabi[300], align: "center" });
  }
}

/* ---- 06 パソコン（ここでしか依頼は見られない） ---- */
function drawPC() {
  rr(0, 0, W, H, "#242838");
  const mx = 24, my = 18, mw = W - 48, mh = H - 72;
  rr(mx - 8, my - 8, mw + 16, mh + 16, "#3e4252");
  rr(mx - 4, my - 4, mw + 8, mh + 8, "#181a22");
  rr(mx, my, mw, mh, C.sumi[50]);

  rr(mx, my, mw, 62, C.white);
  txt("在庫 ＞ カウント依頼", mx + 16, my + 10, { size: 14, color: C.sumi[500] });
  txt("在庫カウント  ドット亭", mx + 16, my + 30, { size: 24, color: C.sumi[900], bold: true });
  txt("推定在庫 計算時刻", mx + mw - 320, my + 12, { size: 13, color: C.sumi[500] });
  txt("9:30", mx + mw - 320, my + 32, { size: 16, color: C.sumi[900], bold: true });
  txt("売上 連携時刻", mx + mw - 170, my + 12, { size: 13, color: C.sumi[500] });
  txt("8:00", mx + mw - 170, my + 32, { size: 16, color: C.sumi[900], bold: true });
  rr(mx, my + 62, mw, 2, C.sumi[200]);

  const ny = my + 72, done = remaining() === 0;
  rr(mx + 12, ny, mw - 24, 52, done ? C.wasabi[50] : C.mikan[50]);
  ro(mx + 12, ny, mw - 24, 52, done ? C.wasabi[500] : C.mikan[300], 2);
  if (done) {
    txt("お疲れさまでした！ 発注に すすめます。", mx + 32, ny + 16,
        { size: 17, color: C.wasabi[700], bold: true });
  } else {
    txt("在庫カウントが必要な食材/備品が " + remaining() + " 件あります。",
        mx + 32, ny + 8, { size: 17, color: C.mikan[700], bold: true });
    txt("現在の在庫数を確認し、本日の納品を含めた在庫数を入力してください。",
        mx + 32, ny + 30, { size: 14, color: C.sumi[700] });
  }

  txt("残り", mx + 14, ny + 64, { size: 16, color: C.sumi[900], bold: true });
  txt(String(remaining()), mx + 48, ny + 58, { size: 22, color: C.wasabi[600], bold: true });
  txt("件", mx + 72, ny + 64, { size: 16, color: C.sumi[900], bold: true });

  let ry = ny + 92;
  INGREDIENTS.forEach((ing, i) => {
    const v = G.day.inputs[ing.id] || 0;
    const conf = !!G.day.confirmed[ing.id];
    const warn = !conf && warnsAt(v, ing.theo);
    const cur = (G.pc.row === i);
    const rh = warn ? 72 : 54;

    rr(mx + 12, ry, mw - 24, rh, warn ? C.tarako[50] : conf ? C.wasabi[50] : C.white);
    if (cur) ro(mx + 12, ry, mw - 24, rh, C.mikan[400], 3);
    else if (warn) ro(mx + 12, ry, mw - 24, rh, C.tarako[500], 2);
    else rr(mx + 12, ry + rh - 2, mw - 24, 2, C.sumi[100]);

    rr(mx + 24, ry + 10, 34, 34, ing.color);
    ro(mx + 24, ry + 10, 34, 34, C.sumi[300], 2);
    txt(ing.name, mx + 70, ry + (ing.delivery ? 8 : 16),
        { size: 18, color: C.sumi[900], bold: true });
    if (ing.delivery) {
      txt("本日" + ing.delivery + ing.unit + " 納品予定", mx + 70, ry + 32,
          { size: 14, color: C.wasabi[600] });
    }
    txt("理由: " + ing.reason, mx + 300, ry + 18, { size: 14, color: C.sumi[500] });

    const stx = mx + mw - 300, stw = 160;
    rr(stx, ry + 12, stw, 32, C.white);
    ro(stx, ry + 12, stw, 32, warn ? C.tarako[500] : cur ? C.mikan[400] : C.sumi[300], 2);
    rr(stx + 2, ry + 14, 30, 28, C.sumi[50]);
    txt("−", stx + 17, ry + 18, { size: 17, color: C.sumi[700], bold: true, align: "center" });
    rr(stx + stw - 32, ry + 14, 30, 28, C.sumi[50]);
    txt("＋", stx + stw - 17, ry + 18, { size: 17, color: C.sumi[700], bold: true, align: "center" });
    txt(v + ing.unit, stx + stw - 40, ry + 18,
        { size: 18, color: C.sumi[900], bold: true, align: "right" });

    const bx2 = mx + mw - 126;
    if (conf) {
      txt("✓ 確定済み", bx2, ry + 18, { size: 16, color: C.wasabi[600], bold: true });
    } else {
      rr(bx2, ry + 12, 104, 32, C.wasabi[500]);
      ro(bx2, ry + 12, 104, 32, C.wasabi[700], 2);
      txt("在庫確定", bx2 + 52, ry + 19, { size: 16, color: C.white, bold: true, align: "center" });
    }
    if (warn) {
      txt("⚠ " + warn, mx + mw - 36, ry + 48,
          { size: 15, color: C.tarako[600], bold: true, align: "right" });
    }
    ry += rh + 4;
  });

  rr(0, H - 44, W, 44, "#0e1018");
  txt("メモは とれない", 16, H - 33, { size: 15, color: C.sumi[600] });
  txt("↑↓ 行 ／ ←→ すうじ ／ Enter 在庫確定 ／ X せきを はなれる", W - 16, H - 33,
      { size: 15, color: C.sumi[400], align: "right" });

  if (G.pc.dialog) drawWarningDialog();
}

/* ---- 07 リザルト ---- */
function drawResult() {
  const r = G.result;
  rr(0, 0, W, H, "#12141e");
  for (let i = 0; i < W; i += 24) rr(i, 0, 12, H, "#141724");

  rr(0, 0, W, 56, "#0c0e16");
  txt("しゅうぎょう！", W / 2, 14, { size: 26, color: C.mikan[300], bold: true, align: "center" });

  const px = 50, py = 78;
  txt("こたえあわせ", px, py, { size: 15, color: C.sumi[500] });
  r.detail.forEach((d, i) => {
    const y = py + 28 + i * 32;
    const ok = (d.input === d.expected);
    txt(d.name, px, y, { size: 17, color: C.sumi[300] });
    txt("入力 " + d.input + d.unit, px + 200, y, { size: 17, color: C.white, bold: true });
    txt("正解 " + d.expected + d.unit, px + 330, y,
        { size: 17, color: ok ? C.wasabi[300] : C.tarako[300], bold: true });
    txt(ok ? "ぴったり" : (d.input > d.expected ? "多い" : "足りない"), px + 462, y,
        { size: 16, color: ok ? C.wasabi[300] : C.mikan[300] });
  });

  const qx = 610;
  [["せいかくさ", r.accuracy + " %", r.accuracy >= 80 ? C.wasabi[300] : C.mikan[300]],
   ["スキップりつ", r.skipRate + " %", r.skipRate > 0 ? C.tarako[300] : C.wasabi[300]],
   ["しょようじかん", Math.floor(r.seconds / 60) + "分" + (r.seconds % 60) + "秒", C.white],
   ["あるいた きょり", r.walked + " ドット", C.sumi[400]],
  ].forEach((row, i) => {
    const y = py + 28 + i * 32;
    txt(row[0], qx, y, { size: 15, color: C.sumi[500] });
    txt(row[1], W - 50, y - 2, { size: 19, color: row[2], bold: true, align: "right" });
  });

  const by = 242;
  rr(50, by, W - 100, 46, "#1c1414");
  ro(50, by, W - 100, 46, C.tarako[500], 2);
  txt("ランク", 70, by + 14, { size: 15, color: C.sumi[400] });
  txt(r.rank, 130, by + 8, { size: 26, color: C.tarako[300], bold: true });
  txt(r.rank === "S" ? "「完璧。ただし誰も見ていない」"
    : r.rank === "A" ? "「よく数えた」"
    : r.rank === "B" ? "「まあ発注はできる」"
    : "「とりあえず 発注は できる」", 170, by + 14, { size: 17, color: C.sumi[300] });

  txt("あしたも " + INGREDIENTS.length + "件 きます。", W / 2, 318,
      { size: 20, color: C.mikan[300], bold: true, align: "center" });
  txt("— これが 毎日 おきている —", W / 2, 350, { size: 16, color: C.sumi[500], align: "center" });

  if (storageOK) {
    txt("きろくしました（れんぞく " + G.save.streak + "日）", W / 2, 396,
        { size: 15, color: C.wasabi[300], align: "center" });
  }
  drawKeyHints([["Enter", "タイトルへ"]], H - 40);
}

/* =========================================================================
   メインループ
   ========================================================================= */
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now; G.t += dt;

  if (G.scene === "kitchen") updateKitchen(dt);

  ctx.clearRect(0, 0, W, H);
  switch (G.scene) {
    case "title":    drawTitle(); break;
    case "briefing": drawBriefing(); break;
    case "kitchen":  drawKitchen(); break;
    case "fridge":   drawFridgeScene(); drawHUD(); break;
    case "shelf":    drawShelfScene(); drawHUD(); break;
    case "pc":       drawPC(); break;
    case "result":   drawResult(); break;
  }
  requestAnimationFrame(frame);
}

G.save = loadSave();
cv.focus();
requestAnimationFrame(frame);
</script>
