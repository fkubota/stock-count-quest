/* =========================================================================
   在庫カウントクエスト / STOCK COUNT QUEST

   飲食店の在庫カウントが、なぜめんどくさいのかを体験するゲーム。

   設計の軸:
   - 何を数えるのかは「パソコンの前」でしか分からない
   - どこに何があるかは教えない。店じゅうを歩いて自分で探す
   - 置いてあるもののほとんどは今日のカウント対象ではない（探すのが仕事）
   - 同じ品目が2か所に分かれていることがある
   - 遊ぶたびに、品目も数も置き場所も変わる
   - 余計な説明はしない。察して数える

   方針: 外部依存ゼロ（CDN・fetch・外部画像・音声ファイルを一切使わない）
   ========================================================================= */

/* ---------------------------------------------------------------- 基本 */
const cv = document.getElementById("g");
const ctx = cv.getContext("2d");
const S = 3, AW = 320, AH = 180, W = AW * S, H = AH * S;
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif';

const C = {
  white:"#ffffff",
  sumi:{50:"#f7f7f7",100:"#e8e8e8",200:"#d4d4d4",300:"#bababa",400:"#a1a1a1",
        500:"#868686",600:"#6f6f6f",700:"#585858",800:"#414141",900:"#1b1b1b"},
  wasabi:{50:"#f0fcfa",300:"#82dad0",500:"#16a595",600:"#008f76",700:"#006e5c"},
  mikan:{50:"#fff9f0",100:"#fff0d6",300:"#fcc862",400:"#f5a820",500:"#e88c00",700:"#a85800"},
  tarako:{50:"#fff4f2",100:"#feebe8",300:"#f9a49c",500:"#e84040",600:"#d02424",700:"#ae1a1a"},
  floorA:"#606876", floorB:"#545c6a", floorLn:"#424856",
  wall:"#363a4a", wallHi:"#484e60", wallLo:"#262934",
  steel:"#aab2be", steelHi:"#ced4de", steelLo:"#7a8290",
  wood:"#966c42", woodLo:"#745230", uiFg:"#ecf0f8",
};

function pr(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x)*S,Math.round(y)*S,Math.round(w)*S,Math.round(h)*S); }
function rr(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function ro(x,y,w,h,c,t){ t=t||2; ctx.strokeStyle=c; ctx.lineWidth=t; ctx.strokeRect(x+t/2,y+t/2,w-t,h-t); }
function txt(s,x,y,o){
  o=o||{}; const size=o.size||16;
  ctx.font=(o.bold?"bold ":"")+size+"px "+FONT;
  ctx.textAlign=o.align||"left"; ctx.textBaseline=o.base||"top";
  ctx.fillStyle=o.color||C.uiFg; ctx.fillText(s,x,y);
}
function tw(s,size,bold){ ctx.font=(bold?"bold ":"")+(size||16)+"px "+FONT; return ctx.measureText(s).width; }
function stamp(x,y,rows,pal){
  for(let j=0;j<rows.length;j++) for(let i=0;i<rows[j].length;i++){
    const ch=rows[j][i]; if(ch!==".") pr(x+i,y+j,1,1,pal[ch]);
  }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>(Math.round(v*10)/10).toString();

/* ---------------------------------------------------------------- 乱数（毎回ちがう店にする） */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
let RND = mulberry32(1);
const ri=(a,b)=>a+Math.floor(RND()*(b-a+1));          // a..b の整数
const pick=arr=>arr[Math.floor(RND()*arr.length)];
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(RND()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------------------------------------------------------------- 音
   音声ファイルは置けないので、WebAudio でその場で合成する。
   ブラウザの制約で、最初のキー入力があるまで音は鳴らせない。 */
let actx=null, musicGain=null, sfxGain=null;
function audio(){
  if(actx === false) return null;              // 一度失敗したら以後あきらめる
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ actx = false; return null; }
    try { actx = new AC(); } catch(e){ actx = false; return null; }
    musicGain = actx.createGain(); musicGain.gain.value = 0.055; musicGain.connect(actx.destination);
    sfxGain   = actx.createGain(); sfxGain.gain.value   = 0.16;  sfxGain.connect(actx.destination);
  }
  try { if(actx.state === "suspended") actx.resume(); } catch(e){}
  return actx;
}
function tone(freq, dur, type, vol, delay, dest){
  const a = audio(); if(!a) return;
  const t0 = a.currentTime + (delay||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, delay){
  const a = audio(); if(!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = vol || 0.2;
  src.connect(g); g.connect(sfxGain);
  src.start(a.currentTime + (delay||0));
}
const SFX = {
  move:  () => tone(640, 0.05, "square", 0.12),
  step:  () => tone(150, 0.04, "triangle", 0.10),
  open:  () => { noise(0.16, 0.22); tone(180, 0.10, "triangle", 0.18); },
  close: () => tone(130, 0.09, "triangle", 0.16),
  door:  () => { tone(220, 0.07, "triangle", 0.18); tone(165, 0.12, "triangle", 0.16, 0.07); },
  tick:  () => tone(880, 0.04, "square", 0.10),
  confirm:()=> { tone(660, 0.08, "square", 0.22); tone(990, 0.12, "square", 0.20, 0.07); },
  warn:  () => { tone(190, 0.22, "sawtooth", 0.22); tone(150, 0.26, "sawtooth", 0.20, 0.10); },
  done:  () => [0,1,2,3].forEach(i => tone([523,659,784,1046][i], 0.18, "square", 0.22, i*0.10)),
  notify:() => [0,1,2].forEach(i => tone([988,1319,1568][i], 0.30, "triangle", 0.30, i*0.13)),
};

/* --- BGM: 16ステップのループを合成する --- */
const BGM = {
  on: true, timer: null, step: 0,
  bass: [0,0,7,0, 5,5,0,0, 3,3,10,3, 5,5,7,7],
  lead: [12,null,15,null, 19,null,15,null, 17,null,15,null, 12,null,10,null],
  root: 110,
};
function bgmStart(){
  if(!audio() || BGM.timer) return;
  BGM.timer = setInterval(() => {
    if(!BGM.on) return;
    const i = BGM.step % 16;
    const b = BGM.bass[i];
    if(b !== null) tone(BGM.root * Math.pow(2, b/12), 0.18, "triangle", 0.5, 0, musicGain);
    const l = BGM.lead[i];
    if(l !== null) tone(BGM.root * 2 * Math.pow(2, l/12), 0.14, "square", 0.22, 0, musicGain);
    BGM.step++;
  }, 215);
}
function bgmToggle(){ BGM.on = !BGM.on; if(BGM.on) bgmStart(); }

/* ---------------------------------------------------------------- セーブ */

function todayStr(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }

  try{ localStorage.setItem(SAVE_KEY+"/p","1"); localStorage.removeItem(SAVE_KEY+"/p"); }
  catch(e){ storageOK=false; return defaultSave(); }
  try{ const raw=localStorage.getItem(SAVE_KEY);
       return raw?Object.assign(defaultSave(),JSON.parse(raw)):defaultSave(); }

}

/* ---------------------------------------------------------------- 通知（起動1分後） */
const NOTIFY_DELAY_MS = 60*1000;
let notifyTimer=null, notifyAt=0;
const notifySupported=()=>(typeof Notification!=="undefined");
function armNotify(){
  if(!notifySupported()||Notification.permission!=="granted") return;
  if(notifyTimer) clearTimeout(notifyTimer);
  notifyAt=Date.now()+NOTIFY_DELAY_MS;
  notifyTimer=setTimeout(()=>{
    notifyTimer=null;
    SFX.notify();
    try{ new Notification("在庫カウントが届いています",{tag:"stock-count-quest"}); }catch(e){}
  },NOTIFY_DELAY_MS);
}
function toggleNotify(){
  if(!notifySupported()) return;
  if(Notification.permission==="granted"){ armNotify(); SFX.notify(); return; }
  Notification.requestPermission().then(p=>{ if(p==="granted") armNotify(); });
}
function notifyState(){
  if(!notifySupported()) return "つかえません";
  if(Notification.permission==="denied") return "ブロックされています";
  if(Notification.permission!=="granted") return "OFF";
  if(notifyTimer) return "あと "+Math.max(0,Math.ceil((notifyAt-Date.now())/1000))+"秒";
  return "とどきました";
}

const FILLS = [1, 1, 0.92, 0.85, 0.78, 0.7, 0.62, 0.55, 0.45, 0.38, 0.3, 0.22, 0.15, 0.08];

// ひとつの保管場所に置かれた、ある品目のかたまり
function makeLot(item){
  const lot = { itemId:item.id, kind:item.kind };
  if(item.kind==="pile"){
    lot.pieces = ri(7, 16);
    lot.layer = [];
    for(let i=0;i<lot.pieces;i++) lot.layer.push(i<Math.ceil(lot.pieces*0.45)?0:(i<Math.ceil(lot.pieces*0.78)?1:2));
  } else if(item.kind==="pieces" || item.kind==="frozen"){
    lot.pieces = ri(3, 11);
  } else if(item.kind==="liquid"){
    lot.canSize = pick([4, 4, 1.8]);
    lot.cans = [];
    const n = ri(2, 4);
    for(let i=0;i<n;i++) lot.cans.push(pick(FILLS));
  } else if(item.kind==="boxes"){
    lot.boxes = [];
    const n = ri(2, 4);
    for(let i=0;i<n;i++) lot.boxes.push(RND() < 0.22 ? 0 : ri(2, 8));
  } else if(item.kind==="weigh"){
    // 容器に入っていて、はかりは中身＋容器の重さ（風袋）を表示する
    lot.cons=[];
    const n=ri(2,3);
    for(let i=0;i<n;i++){
      const tare=pick([180,240,320,460]);
      lot.cons.push({tare, net: ri(2,18)*50});
    }
  } else if(item.kind==="vats"){
    lot.vats = [];
    const n = ri(2, 3);
    for(let i=0;i<n;i++) lot.vats.push(pick(FILLS));
    lot.potSize = pick([4, 5, 6]);
    lot.potFill = RND() < 0.3 ? 0 : pick(FILLS);
  }
  return lot;
}
function lotAmount(lot){
  if(lot.kind==="pieces"||lot.kind==="frozen"||lot.kind==="pile") return lot.pieces;
  if(lot.kind==="liquid") return lot.cans.reduce((a,b)=>a+b,0) * lot.canSize;
  if(lot.kind==="boxes")  return lot.boxes.reduce((a,b)=>a+b,0);
  if(lot.kind==="weigh")  return lot.cons.reduce((a,c)=>a+c.net,0);
  if(lot.kind==="vats")   return lot.vats.reduce((a,b)=>a+b,0) + lot.potSize*lot.potFill;
  return 0;
}

/* --- その日の店をつくる --- */
function buildStore(){
  const store = {};                 // placeId -> [lot]
  for(const p in PLACES) store[p] = [];
  const used = {};                  // itemId -> [placeId]

  // 各保管場所に 2〜3 品目ずつ置く
  for(const p in PLACES){
    const kinds = PLACES[p].kinds;
    const cand = shuffled(CATALOG.filter(i => kinds.indexOf(i.kind)>=0 && i.at.indexOf(p)>=0 && !used[i.id]));
    const n = Math.min(cand.length, ri(3,4));
    for(let i=0;i<n;i++){
      const it = cand[i];
      store[p].push(makeLot(it));
      used[it.id] = [p];
    }
  }
  // 1〜2品目は、別の場所にも分けて保管されている
  const splitable = shuffled(Object.keys(used).filter(id=>{
    const it = CATALOG.find(x=>x.id===id);
    return it.at.length > 1 && it.at.some(p => used[id].indexOf(p)<0 && store[p].length < 4);
  }));
  for(const id of splitable.slice(0, ri(1,2))){
    const it = CATALOG.find(x=>x.id===id);
    const p2 = it.at.find(p => used[id].indexOf(p)<0 && store[p].length < 4);
    if(!p2) continue;
    store[p2].push(makeLot(it));
    used[id].push(p2);
  }
  return { store, used };
}

/* --- その日のカウント依頼をつくる --- */
const REASONS = ["定期カウント","在庫がマイナス","初回カウント","発注とのズレ"];
function buildRequests(store, used){
  const ids = shuffled(Object.keys(used));
  // 2か所に分かれているものを必ず1つは混ぜる
  const multi = ids.filter(id => used[id].length > 1);
  const chosen = [];
  if(multi.length) chosen.push(multi[0]);
  for(const id of ids){ if(chosen.length>=4) break; if(chosen.indexOf(id)<0) chosen.push(id); }

  const deliveryId = pick(chosen.filter(id=>{
    const k = CATALOG.find(x=>x.id===id).kind;
    return k==="pieces"||k==="frozen"||k==="boxes";
  }) || []);

  return chosen.map(id => {
    const it = CATALOG.find(x=>x.id===id);
    let base = 0;
    for(const p of used[id]) for(const lot of store[p]) if(lot.itemId===id) base += lotAmount(lot);
    const delivery = (id===deliveryId) ? ri(1,3) : 0;
    const expected = Math.round((base + delivery)*10)/10;

    // システムの理論在庫。たまに当たっている（＝スキップしても正解になる）
    const r = RND();
    let theo;
    if(r < 0.25)      theo = Math.round(expected);
    else if(r < 0.62) theo = Math.max(1, Math.round(expected * (1.6 + RND()*1.0)));
    else              theo = Math.max(1, Math.round(expected * (0.22 + RND()*0.32)));

    if(it.unit==="g") theo = Math.max(50, Math.round(theo/50)*50);
    return { id, name:it.name, unit:it.unit, color:it.color, kind:it.kind,
             places:used[id].slice(), expected, delivery, theo,
             reason: it.kind==="vats" ? "仕掛品のため毎回" : pick(REASONS) };
  });
}

const objLabel = o => o.label || (PLACES[o.id] ? PLACES[o.id].label : o.id);
const player = { x:200, y:124, dir:"up" };
let stepPhase = 0;

function nearObject(){
  for(const o of ROOMS[G.room].objects){
    const z=o.zone;
    if(player.x+5 >= z.x && player.x+5 <= z.x+z.w &&
       player.y+14 >= z.y-6 && player.y+14 <= z.y+z.h+24) return o;
  }
  return null;
}
function updateRoom(dt){
  const sp = 56*dt;
  let dx=0, dy=0;
  if(k("ArrowLeft")){ dx-=sp; player.dir="left"; }
  if(k("ArrowRight")){ dx+=sp; player.dir="right"; }
  if(k("ArrowUp")){ dy-=sp; player.dir="up"; }
  if(k("ArrowDown")){ dy+=sp; player.dir="down"; }
  if(dx||dy){
    const nx=clamp(player.x+dx,6,AW-16), ny=clamp(player.y+dy,FLOOR_TOP+4,FLOOR_BOTTOM-16);
    const moved=Math.abs(nx-player.x)+Math.abs(ny-player.y);
    G.day.walked+=moved; player.x=nx; player.y=ny;
    stepPhase+=moved;
    if(stepPhase>16){ stepPhase=0; SFX.step(); }
  }
}

/* ---------------------------------------------------------------- 保管場所をのぞく */
function openPlace(placeId){
  const boxes=[];
  G.day.store[placeId].forEach((lot,li)=>{
    if(lot.kind==="boxes") lot.boxes.forEach((_,bi)=>boxes.push({t:"box",li,bi}));
    if(lot.kind==="weigh") lot.cons.forEach((_,bi)=>boxes.push({t:"weigh",li,bi}));
  });
  G.view = { place:placeId, boxes, cursor:0, scale:null, peek:false };
  G.scene = "place";
  SFX.open();
}

/* ---------------------------------------------------------------- パソコン */
function openPC(){
  for(const r of G.day.reqs) if(G.day.inputs[r.id]===undefined) G.day.inputs[r.id]=r.theo;
  G.day.seenList = true;
  G.pc = { row:0, dialog:null };
  G.scene = "pc";
}
function warnsAt(v, theo){
  if(v===0 && theo>0) return "在庫数が0になっています";
  if(v > theo*1.5 || v < theo/1.6) return "想定在庫から大きく離れます";
  return null;
}
function confirmRow(r){
  G.day.confirmed[r.id]=true;
  if(!G.day.touched[r.id]) G.day.skips++;
  SFX.confirm();
  if(remaining()===0){ SFX.done(); finishDay(); }
}

/* ---------------------------------------------------------------- 結果 */
function finishDay(){
  const rs=G.day.reqs, n=rs.length;
  let errSum=0;
  for(const r of rs) errSum += Math.abs((G.day.inputs[r.id]||0) - r.expected) / Math.max(0.5, r.expected);
  const accuracy=Math.max(0,Math.round((1-errSum/n)*100));
  const skipRate=Math.round((G.day.skips/n)*1000)/10;
  const seconds=Math.round((Date.now()-G.day.startedAt)/1000);
  const rank=(accuracy>=95&&G.day.skips===0)?"S":accuracy>=80?"A":accuracy>=55?"B":"C";

  G.result={ accuracy,skipRate,seconds,rank,items:n,walked:Math.round(G.day.walked),
    detail: rs.map(r=>({ name:r.name, unit:r.unit, input:G.day.inputs[r.id]||0,
                         expected:r.expected, places:r.places.map(p=>PLACES[p].label) })) };

  const today=todayStr(), prev=G.save.lastPlayedDate;
  if(prev!==today){ const y=new Date(); y.setDate(y.getDate()-1);
    G.save.streak=(prev===todayStr(y))?G.save.streak+1:1; }
  G.save.lastPlayedDate=today; G.save.totalCounted+=n;
  G.save.days.unshift({date:today,accuracy,skipRate,seconds,rank});
  G.save.days=G.save.days.slice(0,30);
  writeSave();
  G.scene="result";
}

/* =========================================================================
   キー入力
   ========================================================================= */
function onKey(key){
  if(key==="b"){ bgmToggle(); return; }
  if(key==="n" && (G.scene==="title"||G.scene==="briefing")){ toggleNotify(); return; }

  switch(G.scene){
    case "title":
      if(key==="Enter"||key==="z"){ SFX.tick(); G.scene="briefing"; }
      return;

    case "briefing":
      if(key==="Enter"||key==="z"){
        G.day=newDay(); G.room="kitchen";
        player.x=200; player.y=124; player.dir="up";
        SFX.door(); G.scene="room";
      }
      return;

    case "room": {
      if(key!=="z") return;
      const o=nearObject(); if(!o) return;
      if(o.id==="door_b"){ G.room="backyard"; player.x=36; player.y=112; SFX.door(); return; }
      if(o.id==="door_k"){ G.room="kitchen";  player.x=140; player.y=112; SFX.door(); return; }
      if(o.id==="pc"){ SFX.tick(); openPC(); return; }
      if(o.id==="weighst"){ SFX.open(); G.scene="weighst"; return; }
      openPlace(o.id);
      return;
    }

    case "weighst":
      if(key==="x"||key==="Escape"){ SFX.close(); G.scene="room"; return; }
      if(key==="z"){ if(G.day.carry.length){ G.day.carry.length=0; SFX.close(); } }
      return;

    case "place": {
      const v=G.view;
      if(key==="x"||key==="Escape"||key==="z" && v.boxes.length===0){ SFX.close(); G.scene="room"; return; }
      if(key==="ArrowUp"||key==="ArrowDown"){     // 奥をのぞく
        if(G.day.store[v.place].some(l=>l.kind==="pile")){ v.peek=!v.peek; SFX.open(); }
        return;
      }
      if(v.boxes.length===0) return;
      if(key==="ArrowLeft"){ v.cursor=clamp(v.cursor-1,0,v.boxes.length-1); SFX.move(); }
      if(key==="ArrowRight"){ v.cursor=clamp(v.cursor+1,0,v.boxes.length-1); SFX.move(); }
      if(key==="z"){
        const b=v.boxes[v.cursor];
        if(b.t==="weigh"){                      // 持っていく／棚にもどす
          const ix=carryIdx(v.place,b.li,b.bi);
          if(ix>=0){ G.day.carry.splice(ix,1); SFX.close(); }
          else if(G.day.carry.length<CARRY_MAX){ G.day.carry.push({place:v.place,li:b.li,bi:b.bi}); SFX.open(); }
          else SFX.warn();
        } else {
          const kk=v.place+":"+b.li+":"+b.bi;
          G.day.opened[kk]=!G.day.opened[kk];
          G.day.opened[kk]?SFX.open():SFX.close();
        }
      }
      return;
    }

    case "pc": {
      const p=G.pc;
      if(p.dialog){
        const d=p.dialog;
        if(key==="ArrowLeft"){ d.choice=0; SFX.move(); }
        if(key==="ArrowRight"){ d.choice=1; SFX.move(); }
        if(key==="Enter"||key==="z"){
          if(d.choice===0){ p.dialog=null; SFX.close(); G.scene="room"; }
          else { p.dialog=null; confirmRow(d.r); }
        }
        return;
      }
      if(key==="x"||key==="Escape"){ SFX.close(); G.scene="room"; return; }
      const rs=G.day.reqs;
      if(key==="ArrowUp"){ p.row=(p.row+rs.length-1)%rs.length; SFX.move(); }
      if(key==="ArrowDown"){ p.row=(p.row+1)%rs.length; SFX.move(); }

      const r=rs[p.row];
      if(key==="ArrowLeft"||key==="ArrowRight"){
        G.day.confirmed[r.id]=false;
        const step=(r.unit==="g")?50:(r.kind==="liquid"||r.kind==="vats")?0.5:1;
        const d=(key==="ArrowLeft")?-step:step;
        G.day.inputs[r.id]=Math.max(0,Math.round(((G.day.inputs[r.id]||0)+d)*10)/10);
        G.day.touched[r.id]=true; SFX.tick();
      }
      if((key==="Enter"||key==="z") && !G.day.confirmed[r.id]){
        const msg=warnsAt(G.day.inputs[r.id], r.theo);
        if(msg){ p.dialog={r,msg,choice:0}; SFX.warn(); }
        else confirmRow(r);
      }
      return;
    }

    case "result":
      if(key==="Enter"||key==="z"){ armNotify(); SFX.tick(); G.scene="title"; }
      return;
  }
}

function drawFloor(y0,y1,a,b,ln){
  a=a||C.floorA; b=b||C.floorB; ln=ln||C.floorLn;
  for(let ty=Math.floor(y0/16)*16;ty<y1;ty+=16)
    for(let tx=0;tx<AW;tx+=16){
      const yy=Math.max(ty,y0);
      pr(tx,yy,16,Math.min(16,y1-yy),((tx/16+ty/16)%2===0)?a:b);
    }
  for(let ty=Math.ceil(y0/16)*16;ty<y1;ty+=16) pr(0,ty,AW,1,ln);
  for(let tx=0;tx<AW;tx+=16) pr(tx,y0,1,y1-y0,ln);
}
function drawWall(y0,y1,col){
  pr(0,y0,AW,y1-y0,col||C.wall);
  for(let x=0;x<AW;x+=24) pr(x,y0,1,y1-y0-3,C.wallLo);
  pr(0,y1-3,AW,1,C.wallLo); pr(0,y1-2,AW,2,C.wallHi);
}

    rr(bx,by,bw,bh,"#1c2028"); ro(bx,by,bw,bh,"#101218",3);
  } else {
    rr(bx-12,by-12,bw+24,bh+24,C.steelLo); rr(bx-6,by-6,bw+12,bh+12,cold?"#c8d4de":"#c2c8d2");
    rr(bx,by,bw,bh,cold?"#18242c":"#1b242e"); ro(bx,by,bw,bh,"#0c1218",3);
    for(let i=0;i<40;i++) rr(bx+3,by+3+i,bw-6,1,
      "rgba("+(cold?"180,224,240":"130,190,210")+","+(0.12-i*0.0027)+")");
  }
  txt(place.label,W/2,32,{size:19,color:cold?"#a8d8e8":warm?C.mikan[300]:C.wasabi[300],
      bold:true,align:"center"});

  const hasWeigh=lots.some(l=>l.kind==="weigh"), scaleH=0;

  // 段に割り振る。1段に1〜2ロット置いて、縦にも横にも並ぶようにする
  const nLv = Math.min(3, Math.max(2, Math.ceil(lots.length/1.5)));
  const per = Math.ceil(lots.length/nLv);
  const levels=[];
  for(let i=0;i<lots.length;i+=per){
    levels.push(lots.slice(i,i+per).map((lot,j)=>({lot, li:i+j})));
  }
  const top=by+12+scaleH, lvH=(bh-22-scaleH)/levels.length;

  levels.forEach((row,ri)=>{
    const ly=top+ri*lvH, boardY=Math.round(ly+lvH-26);
    rr(bx+8,boardY,bw-16,8, warm?C.woodLo:C.steelLo);
    if(!warm) rr(bx+8,boardY,bw-16,3,C.steelHi);
    const availH=lvH-38, slotW=(bw-24)/row.length;
    row.forEach((cell,ci)=>{
      const sx=bx+12+ci*slotW;
      const item=CATALOG.find(i=>i.id===cell.lot.itemId);
      if(ci>0) rr(sx-2,ly+4,1,lvH-32,"rgba(255,255,255,0.06)");
      drawLot(cell.lot,item,sx+6,slotW-12,boardY,cell.li,v,availH);
      txt(item.name,sx+slotW/2,boardY+10,
          {size:14,color:warm?"#eadcbe":C.sumi[300],align:"center"});
    });
  });

  const hints=[["X","とじる"]];
  if(v.boxes.length) hints.unshift(["←→","えらぶ"],["Z",hasWeigh?"もつ／もどす":"あける"]);
  if(lots.some(l=>l.kind==="pile")) hints.unshift(["↑↓", v.peek?"もどす":"おくを のぞく"]);
  drawKeyHints(hints,H-34);
}
function drawLot(lot,item,sx,sw,base,li,v,availH){
  if(lot.kind==="pieces"||lot.kind==="frozen"){
    const n=lot.pieces;
    const rows=n>4?2:1, cols=Math.ceil(n/rows);
    let bw2=Math.min(64,Math.floor((sw-10)/(cols*0.88+0.2)));
    let bh2=Math.round(bw2*1.35);
    const need=bh2+(rows-1)*18;
    if(need>availH){ const kk=availH/need; bw2=Math.max(10,Math.floor(bw2*kk)); bh2=Math.round(bh2*kk); }
    const step=Math.max(8,Math.round(bw2*0.86));
    const clusterW=(cols-1)*step+bw2, ox=(sw-clusterW)/2;
    for(let r=rows-1;r>=0;r--){          // 奥の列から描いて、手前が重なるようにする
      for(let c=0;c<cols;c++){
        const i=r*cols+c; if(i>=n) continue;
        const jx=Math.round((jit(li*7+i,3)-0.5)*step*0.34);
        const jy=Math.round((jit(li*11+i,5)-0.5)*5);
        const x=sx+ox+c*step+jx+(r===1?Math.round(step*0.42):0);
        const y=base-bh2-r*18+jy;
        if(item.shape==="carton") drawCarton(x,y,bw2,bh2,item.color);
        else drawBag(x,y,bw2,bh2,item.color,lot.kind==="frozen");
      }
    }
  } else if(lot.kind==="pile"){
    const n=lot.pieces;
    const crateW=Math.min(sw-10,Math.max(170,n*16+70)), crateX=sx+(sw-crateW)/2;
    const crateH=Math.min(34,Math.round(availH*0.3));
    let d=Math.round(item.shape==="ellipse"?Math.min(48,crateW/5.2):Math.min(42,crateW/5.6));
    let dh=Math.round(item.shape==="ellipse"?d*0.72:(item.shape==="pepper"?d*1.25:d));
    const lift=v.peek?Math.round(dh*0.62):Math.round(dh*0.17);   // 奥をのぞくと持ち上がって見える
    for(let L=2;L>=0;L--){
      for(let i=0;i<n;i++){
        if(lot.layer[i]!==L) continue;
        const sz=1+(jit(li*13+i,9)-0.5)*0.22;
        const ww=Math.round(d*sz), hh=Math.round(dh*sz);
        const x=crateX+12+Math.round(jit(li*5+i,1)*(crateW-24-ww));
        const y=base-crateH+6-hh-L*lift-Math.round(jit(li*3+i,7)*4);
        drawVeg(item.shape,x,y,ww,hh,item.color);
      }
    }
    rr(crateX,base-crateH,crateW,crateH,"#5e6672");             // コンテナ
    rr(crateX+2,base-crateH+2,crateW-4,crateH-4,"#79828f");
    for(let i=0;i<5;i++) rr(crateX+8+i*((crateW-16)/5),base-crateH+6,4,crateH-12,"#5e6672");
    ro(crateX,base-crateH,crateW,crateH,"#434a54",2);
  } else if(lot.kind==="liquid"){
    const n=lot.cans.length;
    let bh2=Math.min(100,availH-4), bw2=Math.round(bh2*0.52);
    let step=bw2+7;
    if((n-1)*step+bw2>sw-8){
      bw2=Math.max(16,Math.floor((sw-8-(n-1)*7)/n)); bh2=Math.round(bw2/0.52); step=bw2+7;
      if(bh2>availH-4){ bh2=availH-4; }
    }
    const ox=(sw-((n-1)*step+bw2))/2;
    lot.cans.forEach((f,i)=>drawBottle(sx+ox+i*step+Math.round((jit(li+i,2)-0.5)*8),base-bh2,bw2,bh2,f,lot.canSize));
  } else if(lot.kind==="boxes"){
    const n=lot.boxes.length;
    const rows=n>3?2:1, cols=Math.ceil(n/rows);
    let bw2=Math.min(104,Math.floor((sw-8)/cols)-6);
    let bh2=Math.min(100,Math.round(bw2*0.95));
    const need=bh2+(rows-1)*16;
    if(need>availH){ const kk=availH/need; bw2=Math.max(26,Math.floor(bw2*kk)); bh2=Math.round(bh2*kk); }
    const step=bw2+6, clusterW=(cols-1)*step+bw2, ox=(sw-clusterW)/2;
    for(let r=rows-1;r>=0;r--){
      for(let c=0;c<cols;c++){
        const bi=r*cols+c; if(bi>=n) continue;
        const x=sx+ox+c*step+(r===1?Math.round(step*0.3):0), y=base-bh2-r*16;
        const open=!!G.day.opened[v.place+":"+li+":"+bi];
        drawBox(x,y,bw2,bh2,open,lot.boxes[bi],item.color);
        const cur=v.boxes[v.cursor];
        if(cur && cur.t==="box" && cur.li===li && cur.bi===bi){
          ro(x-5,y-20,bw2+10,bh2+26,C.mikan[300],3);
          ctx.fillStyle=C.mikan[300]; ctx.beginPath();
          ctx.moveTo(x+bw2/2-8,y-31); ctx.lineTo(x+bw2/2+8,y-31);
          ctx.lineTo(x+bw2/2,y-22); ctx.closePath(); ctx.fill();
        }
      }
    }
  } else if(lot.kind==="weigh"){
    const n=lot.cons.length;
    let bw2=Math.min(120,Math.floor((sw-10)/n)-8);
    let bh2=Math.min(availH-6,Math.max(34,Math.round(bw2*0.66)));
    const step=bw2+8, ox=(sw-((n-1)*step+bw2))/2;
    lot.cons.forEach((c,ci)=>{
      const x=sx+ox+ci*step, y=base-bh2;
      const held=carryIdx(v.place,li,ci)>=0;
      if(held){ rr(x,base-6,bw2,6,"rgba(0,0,0,0.35)"); }   // 持ち出し中は すき間になる
      else drawBowl(x,y,bw2,bh2,item.color,c.tare,false);
      const cur=v.boxes[v.cursor];
      if(cur && cur.t==="weigh" && cur.li===li && cur.bi===ci){
        ro(x-5,y-20,bw2+10,bh2+26,C.mikan[300],3);
        ctx.fillStyle=C.mikan[300]; ctx.beginPath();
        ctx.moveTo(x+bw2/2-8,y-31); ctx.lineTo(x+bw2/2+8,y-31);
        ctx.lineTo(x+bw2/2,y-22); ctx.closePath(); ctx.fill();
      }
    });
  } else if(lot.kind==="vats"){
    // 寸胴は「何バット分か」に見合う大きさにする（面積が容量に比例するよう √倍）
    const n=lot.vats.length, scale=Math.sqrt(lot.potSize);
    let vh=Math.min(46,Math.floor((availH-4)/(scale*0.96)));
    let vw=Math.round(vh*1.45);
    let ph=Math.round(vh*scale*0.96), pw=Math.round(vw*scale*0.82);
    let total=n*(vw+10)+pw;
    if(total>sw-8){
      const kk=(sw-8)/total;
      vw=Math.max(16,Math.floor(vw*kk)); vh=Math.max(12,Math.floor(vh*kk));
      pw=Math.max(20,Math.floor(pw*kk)); ph=Math.max(16,Math.floor(ph*kk));
      total=n*(vw+10)+pw;
    }
    const ox=(sw-total)/2;
    lot.vats.forEach((f,i)=>drawVat(sx+ox+i*(vw+10),base-vh,vw,vh,f));
    drawPot(sx+ox+n*(vw+10),base-ph,pw,ph,lot.potFill,lot.potSize);
  }
}
const comma=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g,",");
function drawBowl(x,y,w,h,col,tare,onScale){
  rr(x,y,w,h,"#b4bac4"); rr(x+4,y+4,w-8,h-8,"#676d76");
  rr(x+6,y+Math.round(h*0.40),w-12,Math.round(h*0.52),col);     // 中身
  rr(x+6,y+Math.round(h*0.40),w-12,3,"#ffffff88");
  ro(x,y,w,h,"#464c55",3);
  if(w>=72){
    rr(x+w/2-36,y+h-16,72,13,"#efe9d8");
    txt("風袋 "+tare+"g",x+w/2,y+h-15,{size:10,color:"#2c2c30",bold:true,align:"center"});
  }
  if(onScale) ro(x-5,y-5,w+10,h+10,"#6cf0a8",3);
}
// 位置や大きさを不ぞろいにするための、決まった値を返すゆらぎ
const jit=(a,b)=>{ const v=Math.sin(a*12.9898+b*78.233)*43758.5453; return v-Math.floor(v); };
// よこ方向の幅の変化を帯で積んで、丸いものをドット絵らしく描く
function blob(x,y,w,h,col,prof){
  const n=Math.max(5,Math.round(h/4));
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n, ww=Math.max(2,Math.round(w*prof(t)));
    rr(Math.round(x+(w-ww)/2), Math.round(y+h*i/n), ww, Math.ceil(h/n)+1, col);
  }
}
const PROF={
  round:  t=>Math.sqrt(Math.max(0,1-Math.pow(2*t-1,2))),
  ellipse:t=>Math.sqrt(Math.max(0,1-Math.pow(2*t-1,2)))*0.98,
  pepper: t=>t<0.18?0.52+t*1.6:(t<0.62?0.80+(t-0.18)*0.45:1.0-(t-0.62)*0.55),
};
function shade(c,k){                       // ざっくり明暗
  const n=parseInt(c.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));
  return "rgb("+f(n>>16&255)+","+f(n>>8&255)+","+f(n&255)+")";
}
function drawVeg(shape,x,y,w,h,col){
  if(shape==="pepper"){
    blob(x,y+5,w,h-5,shade(col,0.72),PROF.pepper);
    blob(x+1,y+5,w-3,h-7,col,PROF.pepper);
    blob(x+3,y+8,Math.round(w*0.42),Math.round((h-10)*0.7),shade(col,1.3),PROF.pepper);
    rr(x+Math.round(w*0.42),y,Math.max(2,Math.round(w*0.16)),7,"#3f6b34");   // へた
    rr(x+Math.round(w*0.3),y+4,Math.max(3,Math.round(w*0.4)),4,"#4a7a3c");
  } else {
    const prof=PROF[shape]||PROF.round;
    blob(x,y,w,h,shade(col,0.74),prof);
    blob(x+1,y+1,w-2,h-2,col,prof);
    blob(x+Math.round(w*0.14),y+Math.round(h*0.14),Math.round(w*0.34),Math.round(h*0.3),shade(col,1.28),prof);
    if(shape==="round") rr(x+Math.round(w*0.46),y,Math.max(2,Math.round(w*0.1)),4,"#4a7a3c");
  }
}
function drawCarton(x,y,w,h,col){
  rr(x,y,w,h,shade(col,0.82)); rr(x+2,y+2,w-4,h-4,col);
  rr(x,y,w,Math.max(3,Math.round(h*0.14)),"#ffffffcc");
  for(let i=1;i<3;i++) rr(x+Math.round(w*i/3),y+Math.round(h*0.3),1,Math.round(h*0.6),shade(col,0.8));
  rr(x+Math.round(w*0.18),y+Math.round(h*0.45),Math.round(w*0.64),Math.round(h*0.22),"#fdfdfd");
}
function drawBag(x,y,w,h,col,frost){
  rr(x,y,w,h,col); rr(x,y,w,Math.max(3,h*0.12),"#ffffffcc"); ro(x,y,w,h,"#00000055",2);
  rr(x+w*0.2,y+h*0.42,w*0.6,h*0.2,"#fdfdfd");
  if(frost){
    rr(x,y,w,h,"rgba(226,240,248,0.44)");
    for(let i=0;i<7;i++) rr(x+((i*37)%(w-4)),y+((i*53)%(h-4)),3,3,"rgba(255,255,255,0.75)");
  }
}
function drawBottle(x,y,w,h,fill,size){
  const GLASS="#3f3418",GLASS_D="#2a2210",LIQ="#9c7c28";
  const cx=x+w/2, neckW=Math.round(w*0.30), neckH=Math.round(h*0.22), shH=Math.round(h*0.15);
  const bodyY=y+neckH+shH, bodyH=h-neckH-shH;
  rr(cx-neckW/2-3,y-9,neckW+6,11,"#9c2f2a"); rr(cx-neckW/2-3,y-9,neckW+6,3,"#c4514a");
  rr(cx-neckW/2,y,neckW,neckH+2,GLASS);
  for(let i=0;i<5;i++){
    const ww=Math.round(neckW+(w-neckW)*((i+1)/5));
    rr(cx-ww/2,y+neckH+Math.round(shH*i/5),ww,Math.ceil(shH/5)+1,GLASS);
  }
  rr(x,bodyY,w,bodyH,GLASS);
  const fh=Math.round((bodyH-8)*fill);
  rr(x+3,bodyY+bodyH-4-fh,w-6,fh,LIQ);
  rr(x+3,bodyY+bodyH-4-fh,w-6,2,"#b89440");
  rr(x+4,bodyY+4,4,bodyH-12,"rgba(255,245,210,0.13)");
  ro(x,bodyY,w,bodyH,GLASS_D,2);
  rr(x+5,bodyY+5,w-10,20,"#efe9d8"); ro(x+5,bodyY+5,w-10,20,"#a89c80",2);
  txt(num(size)+"L",cx,bodyY+8,{size:13,color:"#2c2c30",bold:true,align:"center"});
}
function drawBox(x,y,w,h,open,contents,col){
  if(!open){
    rr(x,y,w,h,"#b08c5e"); rr(x+2,y+2,w-4,h-4,"#c89c6a"); rr(x,y,w,8,"#9a7a50");
    rr(x+w/2-1,y+8,2,h-8,"#a8864e");
    rr(x+10,y+h/2-10,w-20,20,"#eee4d0");
  } else {
    rr(x-6,y-13,w/2+5,15,"#9a7a50"); rr(x+w/2+1,y-13,w/2+5,15,"#9a7a50");
    rr(x,y,w,h,"#8a6a44"); rr(x+5,y+5,w-10,h-10,"#2e2518");
    if(contents===0){
      txt("からっぽ",x+w/2,y+h/2-9,{size:15,color:C.sumi[500],align:"center"});
    } else {
      const per=3, rows=Math.ceil(contents/per);
      const bw2=Math.floor((w-18)/per);
      const bh2=Math.max(9,Math.min(24,Math.floor((h-20)/rows)-3));
      for(let i=0;i<contents;i++){
        const r=Math.floor(i/per), c=i%per;
        const px=x+9+c*bw2+(r%2?4:0), py=y+h-10-bh2-r*(bh2+3);
        rr(px,py,bw2-3,bh2,col); rr(px,py,bw2-3,2,"#ffffffbb"); ro(px,py,bw2-3,bh2,"#00000055",2);
      }
    }
  }
}
function drawVat(x,y,w,h,fill){
  rr(x,y,w,h,"#aab0ba"); rr(x+4,y+4,w-8,h-8,"#5c626c");
  const fh=Math.round((h-14)*fill);
  rr(x+5,y+h-5-fh,w-10,fh,"#a8742c"); rr(x+5,y+h-5-fh,w-10,3,"#c69244");
  ro(x,y,w,h,"#474d56",3);
  if(w>=44){                                  // 入れ物に容量が書いてある

  }
}
function drawPot(x,y,w,h,fill,size){
  const hw=Math.max(8,Math.round(w*0.12));
  rr(x-hw,y+Math.round(h*0.18),hw,Math.round(h*0.1),"#8a9098");
  rr(x+w,y+Math.round(h*0.18),hw,Math.round(h*0.1),"#8a9098");
  rr(x,y,w,h,"#9aa0aa"); rr(x+5,y+7,w-10,h-12,"#3a3026");
  const fh=Math.round((h-24)*fill);
  rr(x+6,y+h-6-fh,w-12,fh,"#a8742c"); rr(x+6,y+h-6-fh,w-12,3,"#c69244");
  ro(x,y,w,h,"#5a6069",3);
  if(size && w>=52){
    rr(x+w/2-30,y+h-20,60,15,"#e8e4d8");
    txt(size+"バット",x+w/2,y+h-19,{size:12,color:"#2c2c30",bold:true,align:"center"});
  }
}

  txt("推定在庫 計算時刻",mx+mw-320,my+10,{size:13,color:C.sumi[500]});
  txt("9:30",mx+mw-320,my+28,{size:16,color:C.sumi[900],bold:true});
  txt("売上 連携時刻",mx+mw-170,my+10,{size:13,color:C.sumi[500]});
  txt("8:00",mx+mw-170,my+28,{size:16,color:C.sumi[900],bold:true});
  rr(mx,my+56,mw,2,C.sumi[200]);

  const ny=my+64, done=remaining()===0;
  rr(mx+12,ny,mw-24,44,done?C.wasabi[50]:C.mikan[50]);
  ro(mx+12,ny,mw-24,44,done?C.wasabi[500]:C.mikan[300],2);
  if(done) txt("お疲れさまでした！ 発注に すすめます。",mx+32,ny+12,
      {size:17,color:C.wasabi[700],bold:true});
  else {
    txt("在庫カウントが必要な食材/備品が "+remaining()+" 件あります。",mx+32,ny+4,
        {size:17,color:C.mikan[700],bold:true});
    txt("現在の在庫数を確認し、本日の納品を含めた在庫数を入力してください。",mx+32,ny+25,
        {size:14,color:C.sumi[700]});
  }

  let ry=ny+58;
  rs.forEach((r,i)=>{
    const v=G.day.inputs[r.id]||0, conf=!!G.day.confirmed[r.id];
    const warn=!conf&&warnsAt(v,r.theo), cur=(G.pc.row===i);
    const rh=warn?66:50;
    rr(mx+12,ry,mw-24,rh,warn?C.tarako[50]:conf?C.wasabi[50]:C.white);
    if(cur) ro(mx+12,ry,mw-24,rh,C.mikan[400],3);
    else if(warn) ro(mx+12,ry,mw-24,rh,C.tarako[500],2);
    else rr(mx+12,ry+rh-2,mw-24,2,C.sumi[100]);

    rr(mx+22,ry+9,30,30,r.color); ro(mx+22,ry+9,30,30,C.sumi[300],2);
    txt(r.name,mx+62,ry+(r.delivery?6:14),{size:17,color:C.sumi[900],bold:true});
    if(r.delivery) txt("本日"+r.delivery+r.unit+" 納品予定",mx+62,ry+28,
        {size:13,color:C.wasabi[600]});
    txt("理由: "+r.reason,mx+320,ry+16,{size:13,color:C.sumi[500]});

    const stx=mx+mw-300,stw=160;
    rr(stx,ry+10,stw,30,C.white);
    ro(stx,ry+10,stw,30,warn?C.tarako[500]:cur?C.mikan[400]:C.sumi[300],2);
    rr(stx+2,ry+12,28,26,C.sumi[50]);
    txt("−",stx+16,ry+15,{size:17,color:C.sumi[700],bold:true,align:"center"});
    rr(stx+stw-30,ry+12,28,26,C.sumi[50]);
    txt("＋",stx+stw-16,ry+15,{size:17,color:C.sumi[700],bold:true,align:"center"});
    txt(num(v)+r.unit,stx+stw-38,ry+15,{size:17,color:C.sumi[900],bold:true,align:"right"});

    const bx2=mx+mw-126;
    if(conf) txt("✓ 確定済み",bx2,ry+15,{size:15,color:C.wasabi[600],bold:true});
    else {
      rr(bx2,ry+10,100,30,C.wasabi[500]); ro(bx2,ry+10,100,30,C.wasabi[700],2);
      txt("在庫確定",bx2+50,ry+16,{size:15,color:C.white,bold:true,align:"center"});
    }
    if(warn) txt("⚠ "+warn,mx+mw-34,ry+44,
        {size:14,color:C.tarako[600],bold:true,align:"right"});
    ry+=rh+3;
  });

  rr(0,H-36,W,36,"#0e1018");
  txt("↑↓ 行 ／ ←→ すうじ ／ Enter 在庫確定 ／ X せきを はなれる",W-16,H-27,
      {size:15,color:C.sumi[400],align:"right"});
  if(G.pc.dialog) drawWarningDialog();
}
function drawWarningDialog(){
  const d=G.pc.dialog;
  rr(0,0,W,H,"rgba(0,0,0,0.55)");
  const dw=640,dh=268,dx=(W-dw)/2,dy=130;
  rr(dx,dy,dw,dh,C.white); ro(dx,dy,dw,dh,C.tarako[500],4); rr(dx,dy,dw,44,C.tarako[500]);
  txt("⚠  けいこく",dx+18,dy+12,{size:20,color:C.white,bold:true});
  txt(d.msg,dx+28,dy+68,{size:23,color:C.tarako[600],bold:true});
  txt(d.r.name+"　システム想定 "+num(d.r.theo)+d.r.unit+"　→　入力 "+num(G.day.inputs[d.r.id])+d.r.unit,
      dx+28,dy+108,{size:17,color:C.sumi[900]});
  txt("ほんとうに その かず で あっていますか？",dx+28,dy+134,{size:16,color:C.sumi[700]});
  ["数えなおす","このまま確定"].forEach((label,i)=>{
    const bw2=200,bx=dx+28+i*(bw2+20),by=dy+176,on=(d.choice===i);
    rr(bx,by,bw2,44,i===0?C.sumi[100]:C.tarako[500]);
    ro(bx,by,bw2,44,on?C.sumi[900]:(i===0?C.sumi[400]:C.tarako[700]),on?4:2);
    txt(label,bx+bw2/2,by+12,{size:17,bold:true,align:"center",color:i===0?C.sumi[900]:C.white});
  });
  txt("※ 数えなおすと、また 歩いて 見にいくことになる",dx+28,dy+232,
      {size:14,color:C.mikan[500]});
}

/* ---- リザルト ---- */
function drawResult(){
  const r=G.result;
  rr(0,0,W,H,"#12141e");
  for(let i=0;i<W;i+=24) rr(i,0,12,H,"#141724");
  rr(0,0,W,48,"#0c0e16");
  txt("しゅうぎょう！",W/2,11,{size:24,color:C.mikan[300],bold:true,align:"center"});

  const px=40,py=64;
  txt("こたえあわせ",px,py,{size:15,color:C.sumi[500]});
  r.detail.forEach((d,i)=>{
    const y=py+26+i*32;
    const diff=Math.abs(d.input-d.expected);
    const ok=diff<0.01, near=!ok && diff/Math.max(0.5,d.expected)<=0.05;
    txt(d.name,px,y,{size:16,color:C.sumi[300]});
    txt(d.places.join("・"),px,y+16,{size:12,color:C.sumi[600]});
    txt("入力 "+num(d.input)+d.unit,px+210,y+4,{size:16,color:C.white,bold:true});
    txt("正解 "+num(d.expected)+d.unit,px+340,y+4,
        {size:16,color:ok?C.wasabi[300]:C.tarako[300],bold:true});
    txt(ok?"ぴったり":near?"ほぼ合ってる":(d.input>d.expected?"多い":"足りない"),px+480,y+4,
        {size:15,color:ok||near?C.wasabi[300]:C.mikan[300]});
  });

  const qx=630;
  [["せいかくさ",r.accuracy+" %",r.accuracy>=80?C.wasabi[300]:C.mikan[300]],
   ["スキップりつ",r.skipRate+" %",r.skipRate>0?C.tarako[300]:C.wasabi[300]],
   ["しょようじかん",Math.floor(r.seconds/60)+"分"+(r.seconds%60)+"秒",C.white],
   ["あるいた きょり",r.walked+" ドット",C.sumi[400]],
  ].forEach((row,i)=>{
    const y=py+26+i*32;
    txt(row[0],qx,y+4,{size:15,color:C.sumi[500]});
    txt(row[1],W-40,y+2,{size:18,color:row[2],bold:true,align:"right"});
  });

  const by=py+26+r.detail.length*32+14;
  rr(40,by,W-80,44,"#1c1414"); ro(40,by,W-80,44,C.tarako[500],2);
  txt("ランク",60,by+13,{size:15,color:C.sumi[400]});
  txt(r.rank,120,by+7,{size:25,color:C.tarako[300],bold:true});
  txt(r.rank==="S"?"「完璧。ただし誰も見ていない」":r.rank==="A"?"「よく数えた」"
     :r.rank==="B"?"「まあ発注はできる」":"「とりあえず 発注は できる」",
     160,by+13,{size:17,color:C.sumi[300]});

  txt("あしたも きます。",W/2,by+70,{size:20,color:C.mikan[300],bold:true,align:"center"});
  txt("— これが 毎日 おきている —",W/2,by+100,{size:16,color:C.sumi[500],align:"center"});
  drawKeyHints([["Enter","タイトルへ"]],H-34);
}

/* =========================================================================
   メインループ
   ========================================================================= */
let prev=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-prev)/1000); prev=now; G.t+=dt;
  if(G.scene==="room") updateRoom(dt);
  ctx.clearRect(0,0,W,H);
  switch(G.scene){
    case "title":    drawTitle(); break;
    case "briefing": drawBriefing(); break;
    case "room":     drawRoom(); break;
    case "place":    drawPlace(); drawHUD(); break;
    case "weighst":  drawWeighStation(); drawHUD(); break;
    case "pc":       drawPC(); break;
    case "result":   drawResult(); break;
  }
  requestAnimationFrame(frame);
}

G.save=loadSave();
armNotify();
cv.focus();
requestAnimationFrame(frame);
</script>
