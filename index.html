<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在庫カウントクエスト</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0f16; color: #cfd4e0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  }
  #wrap {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px;
  }
  canvas {
    width: 100%; max-width: 960px; aspect-ratio: 16 / 9;
    background: #11131c;
    border: 2px solid #2a2f40; border-radius: 4px;
    image-rendering: pixelated;
    outline: none;
  }
  #hint {
    max-width: 960px; width: 100%;
    margin: 0; font-size: 13px; line-height: 1.7; color: #6f7788;
  }
  #hint b { color: #9aa3b6; font-weight: 600; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="g" width="960" height="540" tabindex="0"></canvas>
  <p id="hint">
    <b>そうさ</b> ↑↓←→ いどう ／ Z しらべる・あける ／ X もどる ／ Enter かくてい<br>
    画面をクリックしてからキーを押してください。数は<b>自分の目で数えて、自分で覚えて</b>ください。
  </p>
</div>

<script>
"use strict";
/* =========================================================================
   在庫カウントクエスト / STOCK COUNT QUEST

   飲食店の在庫カウントが、なぜめんどくさいのかを体験するゲーム。

   設計の軸:
   - 何を数えるのかは「パソコンの前」でしか分からない
   - どこに何があるかは教えない。部屋を歩いて、自分で開けて探す
   - 数える補助は一切ない。目で見て、自分の頭で覚えて、歩いて入力しに行く

   方針:
   - 外部依存ゼロ。CDNもfetchも外部画像も使わない（file:// でも動く）
   - 背景とオブジェクトはドット絵（アート座標を3倍して矩形で塗る）
   - 文字はCanvasに普通のフォントでくっきり描く
   ========================================================================= */

/* ---------------------------------------------------------------- 基本 */
const cv = document.getElementById("g");
const ctx = cv.getContext("2d");

const S = 3;                  // ドット1個 = 3実ピクセル
const AW = 320, AH = 180;     // アート座標系
const W = AW * S, H = AH * S; // 960 x 540

const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif';

// 業務システムらしく見せるための配色
const C = {
  white:  "#ffffff",
  sumi:   { 50:"#f7f7f7", 100:"#e8e8e8", 200:"#d4d4d4", 300:"#bababa",
            400:"#a1a1a1", 500:"#868686", 600:"#6f6f6f", 700:"#585858",
            800:"#414141", 900:"#1b1b1b" },
  wasabi: { 50:"#f0fcfa", 300:"#82dad0", 500:"#16a595", 600:"#008f76", 700:"#006e5c" },
  mikan:  { 50:"#fff9f0", 100:"#fff0d6", 300:"#fcc862", 400:"#f5a820", 500:"#e88c00", 700:"#a85800" },
  tarako: { 50:"#fff4f2", 100:"#feebe8", 300:"#f9a49c", 500:"#e84040", 600:"#d02424", 700:"#ae1a1a" },
  floorA: "#606876", floorB: "#545c6a", floorLn: "#424856",
  wall:   "#363a4a", wallHi: "#484e60", wallLo: "#262934",
  steel:  "#aab2be", steelHi: "#ced4de", steelLo: "#7a8290",
  wood:   "#966c42", woodLo: "#745230",
  uiFg:   "#ecf0f8",
};

/* ---- 描画ヘルパ ---- */
function pr(x, y, w, h, col) { // アート座標の矩形（ドット絵用）
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x) * S, Math.round(y) * S, Math.round(w) * S, Math.round(h) * S);
}
function rr(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function ro(x, y, w, h, col, t) {
  t = t || 2; ctx.strokeStyle = col; ctx.lineWidth = t;
  ctx.strokeRect(x + t / 2, y + t / 2, w - t, h - t);
}
function txt(s, x, y, o) {
  o = o || {};
  const size = o.size || 16;
  ctx.font = (o.bold ? "bold " : "") + size + "px " + FONT;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "top";
  ctx.fillStyle = o.color || C.uiFg;
  ctx.fillText(s, x, y);
}
function tw(s, size, bold) {
  ctx.font = (bold ? "bold " : "") + (size || 16) + "px " + FONT;
  return ctx.measureText(s).width;
}
function stamp(x, y, rows, pal) {
  for (let j = 0; j < rows.length; j++) {
    for (let i = 0; i < rows[j].length; i++) {
      const ch = rows[j][i];
      if (ch === ".") continue;
      pr(x + i, y + j, 1, 1, pal[ch]);
    }
  }
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// 2.5 は "2.5"、5 は "5" と出す（余計な .0 を付けない）
const num = v => (Math.round(v * 10) / 10).toString();

/* ---------------------------------------------------------------- スプライト */
const CHEF_PAL = { H:"#f8f8fc", S:"#e8ba96", K:"#20202c", M:"#c48670",
                   C:"#f0f2f8", A:"#5c94d6", B:"#3a3e52", N:"#222430" };
const CHEF_FRONT = [
  "...HHHHHH...", "..HHHHHHHH..", ".HHHHHHHHHH.",
  "..SSSSSSSS..", "..SKSSSSKS..", "..SSSSSSSS..", "...SMMMMS...",
  "..CCCCCCCC..", ".CCCAAAACCC.", "SCCCAAAACCCS", "SCCCAAAACCCS",
  ".CCCAAAACCC.", "..CCAAAACC..", "...BB..BB...", "...BB..BB...", "..NNN..NNN..",
];
const CHEF_BACK = [
  "...HHHHHH...", "..HHHHHHHH..", ".HHHHHHHHHH.",
  "..SSSSSSSS..", "..SSSSSSSS..", "..SSSSSSSS..", "...SSSSSS...",
  "..CCCCCCCC..", ".CCCCCCCCCC.", "SCCCCCCCCCCS", "SCCCCCCCCCCS",
  ".CCCCCCCCCC.", "..CCCCCCCC..", "...BB..BB...", "...BB..BB...", "..NNN..NNN..",
];

/* ---------------------------------------------------------------- セーブ */
const SAVE_KEY = "stock-count-quest/v1";
let storageOK = true;

function todayStr(d) {
  d = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const defaultSave = () => ({ lastPlayedDate: null, streak: 0, totalCounted: 0, days: [] });
function probeStorage() {
  try {
    localStorage.setItem(SAVE_KEY + "/probe", "1");
    localStorage.removeItem(SAVE_KEY + "/probe");
    return true;
  } catch (e) { return false; }
}
function loadSave() {
  storageOK = probeStorage();
  if (!storageOK) return defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? Object.assign(defaultSave(), JSON.parse(raw)) : defaultSave();
  } catch (e) { return defaultSave(); }
}
function writeSave() {
  if (!storageOK) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) { storageOK = false; }
}

/* ---------------------------------------------------------------- 通知
   起動（ページを開く）から1分後に、ブラウザ通知で催促する。
   静的ページなので「閉じている間」は通知できない。タブを開いている間だけ届く。
   file:// で開いた場合はブラウザが通知を許可しないことが多い。 */
const NOTIFY_DELAY_MS = 60 * 1000;
let notifyTimer = null, notifyAt = 0;

const notifySupported = () => (typeof Notification !== "undefined");

function armNotify() {
  if (!notifySupported() || Notification.permission !== "granted") return;
  if (notifyTimer) clearTimeout(notifyTimer);
  notifyAt = Date.now() + NOTIFY_DELAY_MS;
  notifyTimer = setTimeout(() => {
    notifyTimer = null;
    try {
      new Notification("在庫カウントの 依頼が きています", {
        body: "在庫カウントが必要な食材/備品が " + INGREDIENTS.length + " 件あります。",
        tag: "stock-count-quest",
      });
    } catch (e) { /* 出せない環境では黙って諦める */ }
  }, NOTIFY_DELAY_MS);
}
function toggleNotify() {
  if (!notifySupported()) return;
  if (Notification.permission === "granted") { armNotify(); return; }
  Notification.requestPermission().then(p => { if (p === "granted") armNotify(); });
}
function notifyState() {
  if (!notifySupported()) return "この環境では つかえません";
  if (Notification.permission === "denied") return "ブラウザで ブロックされています";
  if (Notification.permission !== "granted") return "OFF　N キーで オンにする";
  if (notifyTimer) return "ON　あと " + Math.max(0, Math.ceil((notifyAt - Date.now()) / 1000)) + "秒で とどきます";
  return "ON　とどきました（N キーで もういちど）";
}

/* ---------------------------------------------------------------- データ
   place はゲーム内部の配置情報。画面には一切出さない（自分で探してもらう）。
   theo はシステムが持っている理論在庫。わざとズレている。
   delivery は「本日納品予定」。まだ箱のままで目には入らないが、足さないと正解にならない。
*/
const INGREDIENTS = [
  { id:"pork", name:"ぶたバラ肉", unit:"袋", color:"#e8a294",
    place:"fridge", kind:"pieces", pieces:11,
    theo:22, delivery:2, reason:"定期カウント" },

  { id:"oil", name:"サラダ油", unit:"L", color:"#ecc85e",
    place:"fridge", kind:"liquid", canSize:4, cans:[1, 1, 0.5, 1],
    theo:4, delivery:0, reason:"在庫がマイナス" },

  { id:"wakame", name:"かんそうわかめ", unit:"袋", color:"#8fae84",
    place:"shelf", kind:"boxes", boxes:[6, 0, 4, 3],
    theo:13, delivery:0, reason:"初回カウント" },

  { id:"dashi", name:"和風だし（仕込みずみ）", unit:"バット", color:"#b08848",
    place:"prep", kind:"vats", vats:[1, 0.5, 1], potSize:5, potFill:0.5,
    theo:2, delivery:0, reason:"仕掛品のため毎回" },

  { id:"potato", name:"れいとうポテト", unit:"袋", color:"#e8d7a8",
    place:"freezer", kind:"frozen", pieces:9,
    theo:9, delivery:0, reason:"定期カウント" },
];

// 正解（＝入力すべき値）
function expectedOf(ing) {
  let base = 0;
  if (ing.kind === "pieces" || ing.kind === "frozen") base = ing.pieces;
  if (ing.kind === "liquid") base = ing.cans.reduce((a, b) => a + b, 0) * ing.canSize;
  if (ing.kind === "boxes")  base = ing.boxes.reduce((a, b) => a + b, 0);
  if (ing.kind === "vats")   base = ing.vats.reduce((a, b) => a + b, 0) + ing.potSize * ing.potFill;
  return base + ing.delivery;
}
const byPlace = p => INGREDIENTS.filter(i => i.place === p);

/* ---------------------------------------------------------------- 状態 */
const G = { scene: "title", room: "kitchen", save: null, day: null, t: 0 };

function newDay() {
  return {
    inputs: {}, touched: {}, confirmed: {},
    openedBoxes: {},  // "wakame:2" -> true
    seenList: false,  // 一度でもパソコンで依頼を見たか
    skips: 0, walked: 0,
    startedAt: Date.now(),
  };
}
const remaining = () => INGREDIENTS.filter(i => !G.day.confirmed[i.id]).length;

/* ---------------------------------------------------------------- 入力 */
const held = Object.create(null);
const EAT = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter"];
window.addEventListener("keydown", e => {
  if (EAT.indexOf(e.key) >= 0) e.preventDefault();
  if (!held[e.key]) onKey(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  held[e.key] = true;
});
window.addEventListener("keyup", e => { held[e.key] = false; });
cv.addEventListener("mousedown", () => cv.focus());
const k = n => !!held[n];

/* ---------------------------------------------------------------- 部屋 */
const FLOOR_TOP = 58, FLOOR_BOTTOM = 172;
const ROOMS = {
  kitchen: {
    name: "ちゅうぼう",
    objects: [
      { id:"fridge", label:"れいぞうこ",     prompt:"あける",   x:18,  y:14,  w:30, h:44, zone:{x:12,  y:58,  w:42, h:20} },
      { id:"shelf",  label:"じょうおんだな", prompt:"しらべる", x:62,  y:18,  w:62, h:40, zone:{x:58,  y:58,  w:70, h:20} },
      { id:"door_b", label:"▶ バックヤード", prompt:"でる",     x:140, y:14,  w:26, h:44, zone:{x:134, y:58,  w:38, h:20} },
      { id:"pc",     label:"パソコン",       prompt:"つかう",   x:236, y:24,  w:50, h:34, zone:{x:230, y:58,  w:62, h:20} },
      { id:"prep",   label:"さぎょうだい",   prompt:"しらべる", x:108, y:106, w:80, h:24, zone:{x:104, y:130, w:88, h:20} },
    ],
  },
  backyard: {
    name: "バックヤード",
    objects: [
      { id:"door_k",  label:"◀ ちゅうぼう", prompt:"もどる",   x:20,  y:14, w:26, h:44, zone:{x:14,  y:58, w:38, h:20} },
      { id:"freezer", label:"れいとうこ",   prompt:"あける",   x:96,  y:10, w:38, h:48, zone:{x:90,  y:58, w:50, h:20} },
    ],
  },
};
const player = { x: 200, y: 120, dir: "up" };

function nearObject() {
  for (const o of ROOMS[G.room].objects) {
    const z = o.zone;
    if (player.x + 5 >= z.x && player.x + 5 <= z.x + z.w &&
        player.y + 14 >= z.y - 6 && player.y + 14 <= z.y + z.h + 24) return o;
  }
  return null;
}
function updateRoom(dt) {
  const sp = 54 * dt;
  let dx = 0, dy = 0;
  if (k("ArrowLeft"))  { dx -= sp; player.dir = "left"; }
  if (k("ArrowRight")) { dx += sp; player.dir = "right"; }
  if (k("ArrowUp"))    { dy -= sp; player.dir = "up"; }
  if (k("ArrowDown"))  { dy += sp; player.dir = "down"; }
  if (dx || dy) {
    const nx = clamp(player.x + dx, 6, AW - 16);
    const ny = clamp(player.y + dy, FLOOR_TOP + 4, FLOOR_BOTTOM - 16);
    G.day.walked += Math.abs(nx - player.x) + Math.abs(ny - player.y);
    player.x = nx; player.y = ny;
  }
}

/* ---------------------------------------------------------------- パソコン */
function openPC() {
  for (const ing of INGREDIENTS) {
    if (G.day.inputs[ing.id] === undefined) G.day.inputs[ing.id] = ing.theo;
  }
  G.day.seenList = true;   // ここで初めて「何を数えるか」が分かる
  G.pc = { row: 0, dialog: null };
  G.scene = "pc";
}
// 入力値が理論在庫から離れすぎていないかを見る。
// 業務システムによくある「想定と違いますよ」の警告をイメージしている。
function warnsAt(v, theo) {
  if (v === 0 && theo > 0) return "在庫数が0になっています";
  if (v > theo * 1.5 || v < theo / 1.6) return "想定在庫から大きく離れます";
  return null;
}
function confirmRow(ing) {
  G.day.confirmed[ing.id] = true;
  if (!G.day.touched[ing.id]) G.day.skips++; // 未編集のまま確定＝スキップ
  if (remaining() === 0) finishDay();
}

/* ---------------------------------------------------------------- 結果 */
function finishDay() {
  let errSum = 0;
  for (const ing of INGREDIENTS) {
    const exp = expectedOf(ing);
    errSum += Math.abs((G.day.inputs[ing.id] || 0) - exp) / exp;
  }
  const n = INGREDIENTS.length;
  const accuracy = Math.max(0, Math.round((1 - errSum / n) * 100));
  const skipRate = Math.round((G.day.skips / n) * 1000) / 10;
  const seconds = Math.round((Date.now() - G.day.startedAt) / 1000);
  const rank = (accuracy >= 95 && G.day.skips === 0) ? "S"
             : accuracy >= 80 ? "A" : accuracy >= 55 ? "B" : "C";

  G.result = {
    accuracy, skipRate, seconds, rank, items: n,
    walked: Math.round(G.day.walked),
    detail: INGREDIENTS.map(ing => ({
      name: ing.name, unit: ing.unit,
      input: G.day.inputs[ing.id] || 0, expected: expectedOf(ing),
    })),
  };

  const today = todayStr();
  const prev = G.save.lastPlayedDate;
  if (prev !== today) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    G.save.streak = (prev === todayStr(y)) ? G.save.streak + 1 : 1;
  }
  G.save.lastPlayedDate = today;
  G.save.totalCounted += n;
  G.save.days.unshift({ date: today, accuracy, skipRate, seconds, rank });
  G.save.days = G.save.days.slice(0, 30);
  writeSave();

  G.scene = "result";
}

/* =========================================================================
   キー入力
   ========================================================================= */
function onKey(key) {
  switch (G.scene) {

    case "title":
      if (key === "n") { toggleNotify(); return; }
      if (key === "Enter" || key === "z") G.scene = "briefing";
      return;

    case "briefing":
      if (key === "Enter" || key === "z") {
        G.day = newDay();
        G.room = "kitchen";
        player.x = 200; player.y = 120; player.dir = "up";
        G.scene = "room";
      }
      return;

    case "room": {
      if (key !== "z") return;
      const o = nearObject();
      if (!o) return;
      if (o.id === "door_b") { G.room = "backyard"; player.x = 40;  player.y = 110; return; }
      if (o.id === "door_k") { G.room = "kitchen";  player.x = 150; player.y = 110; return; }
      if (o.id === "shelf")  { G.shelf = { cursor: 0 }; G.scene = "shelf"; return; }
      if (o.id === "pc")     { openPC(); return; }
      G.scene = o.id;  // fridge / prep / freezer
      return;
    }

    case "fridge": case "prep": case "freezer":
      if (key === "x" || key === "z" || key === "Escape") G.scene = "room";
      return;

    case "shelf": {
      const ing = byPlace("shelf")[0];
      const s = G.shelf;
      if (key === "x" || key === "Escape") { G.scene = "room"; return; }
      if (key === "ArrowLeft")  s.cursor = clamp(s.cursor - 1, 0, ing.boxes.length - 1);
      if (key === "ArrowRight") s.cursor = clamp(s.cursor + 1, 0, ing.boxes.length - 1);
      if (key === "z") {
        const bk = ing.id + ":" + s.cursor;
        G.day.openedBoxes[bk] = !G.day.openedBoxes[bk];
      }
      return;
    }

    case "pc": {
      const p = G.pc;
      if (p.dialog) {
        const d = p.dialog;
        if (key === "ArrowLeft")  d.choice = 0;
        if (key === "ArrowRight") d.choice = 1;
        if (key === "Enter" || key === "z") {
          if (d.choice === 0) { p.dialog = null; G.scene = "room"; } // 数えなおしに戻る
          else { p.dialog = null; confirmRow(d.ing); }
        }
        return;
      }
      if (key === "x" || key === "Escape") { G.scene = "room"; return; }
      if (key === "ArrowUp")   p.row = (p.row + INGREDIENTS.length - 1) % INGREDIENTS.length;
      if (key === "ArrowDown") p.row = (p.row + 1) % INGREDIENTS.length;

      const ing = INGREDIENTS[p.row];
      if (key === "ArrowLeft" || key === "ArrowRight") {
        G.day.confirmed[ing.id] = false; // 確定済みでも再編集できる
        const step = (ing.kind === "vats") ? 0.5 : 1;   // 仕掛品だけ 0.5 刻み
        const d = (key === "ArrowLeft") ? -step : step;
        G.day.inputs[ing.id] = Math.max(0, Math.round(((G.day.inputs[ing.id] || 0) + d) * 10) / 10);
        G.day.touched[ing.id] = true;
      }
      if ((key === "Enter" || key === "z") && !G.day.confirmed[ing.id]) {
        const msg = warnsAt(G.day.inputs[ing.id], ing.theo);
        if (msg) p.dialog = { ing, msg, choice: 0 };
        else confirmRow(ing);
      }
      return;
    }

    case "result":
      if (key === "Enter" || key === "z") { armNotify(); G.scene = "title"; }
      return;
  }
}

/* =========================================================================
   描画 ― 部屋のパーツ
   ========================================================================= */
function drawFloor(y0, y1, a, b, ln) {
  a = a || C.floorA; b = b || C.floorB; ln = ln || C.floorLn;
  for (let ty = Math.floor(y0 / 16) * 16; ty < y1; ty += 16) {
    for (let tx = 0; tx < AW; tx += 16) {
      const yy = Math.max(ty, y0);
      pr(tx, yy, 16, Math.min(16, y1 - yy), ((tx / 16 + ty / 16) % 2 === 0) ? a : b);
    }
  }
  for (let ty = Math.ceil(y0 / 16) * 16; ty < y1; ty += 16) pr(0, ty, AW, 1, ln);
  for (let tx = 0; tx < AW; tx += 16) pr(tx, y0, 1, y1 - y0, ln);
}
function drawWall(y0, y1, col) {
  col = col || C.wall;
  pr(0, y0, AW, y1 - y0, col);
  for (let x = 0; x < AW; x += 24) pr(x, y0, 1, y1 - y0 - 3, C.wallLo);
  pr(0, y1 - 3, AW, 1, C.wallLo);
  pr(0, y1 - 2, AW, 2, C.wallHi);
}
function drawFridgeBody(x, y, w, h, cold) {
  pr(x, y, w, h, C.steelLo);
  pr(x + 1, y + 1, w - 2, h - 3, cold ? "#b6c6d2" : C.steel);
  pr(x + 2, y + 2, w - 4, 2, C.steelHi);
  pr(x, y + 16, w, 1, C.steelLo);
  pr(x + w - 6, y + 5, 2, 8, "#464c5c");
  pr(x + w - 6, y + 22, 2, 15, "#464c5c");
  pr(x, y + h - 2, w, 2, "#282c3a");
}
function drawShelfBody(x, y, w, h) {
  pr(x, y, w, h, C.woodLo);
  pr(x + 1, y + 1, w - 2, h - 2, C.wood);
  const th = Math.floor(h / 3);
  for (let i = 1; i < 3; i++) pr(x + 1, y + i * th, w - 2, 2, C.woodLo);

/* 日本酒の瓶のような容器。目盛りは付けない。
   濃い色のガラス越しに液面を見るので「だいたい半分…か？」としか言えない。 */
function drawBottle(x, y, w, h, fill, size) {
  const GLASS = "#3f3418", GLASS_D = "#2a2210", LIQ = "#9c7c28";
  const cx = x + w / 2;
  const neckW = Math.round(w * 0.30), neckH = Math.round(h * 0.22), shH = Math.round(h * 0.15);
  const bodyY = y + neckH + shH, bodyH = h - neckH - shH;

  rr(cx - neckW / 2 - 3, y - 11, neckW + 6, 13, "#9c2f2a");  // キャップ
  rr(cx - neckW / 2 - 3, y - 11, neckW + 6, 3, "#c4514a");
  rr(cx - neckW / 2, y, neckW, neckH + 2, GLASS);            // 首
  const steps = 5;                                           // 肩
  for (let i = 0; i < steps; i++) {
    const ww = Math.round(neckW + (w - neckW) * ((i + 1) / steps));
    rr(cx - ww / 2, y + neckH + Math.round(shH * i / steps), ww, Math.ceil(shH / steps) + 1, GLASS);
  }
  rr(x, bodyY, w, bodyH, GLASS);                             // 胴
  const fh = Math.round((bodyH - 8) * fill);
  rr(x + 4, bodyY + bodyH - 4 - fh, w - 8, fh, LIQ);
  rr(x + 4, bodyY + bodyH - 4 - fh, w - 8, 2, "#b89440");    // 液面（控えめに）
  rr(x + 5, bodyY + 4, 5, bodyH - 12, "rgba(255,245,210,0.13)");  // 照り返し
  rr(cx + 10, bodyY + 10, 3, bodyH - 26, "rgba(255,245,210,0.07)");
  ro(x, bodyY, w, bodyH, GLASS_D, 2);
  // 容量ラベル。胴の上寄りに貼る（中央だと液面が隠れて判断不能になる）
  rr(x + 7, bodyY + 5, w - 14, 22, "#efe9d8");
  ro(x + 7, bodyY + 5, w - 14, 22, "#a89c80", 2);
  txt(size + "L", cx, bodyY + 8, { size: 15, color: "#2c2c30", bold: true, align: "center" });
}
function drawBag(x, y, w, h, col, frost) {
  rr(x, y, w, h, col);
  rr(x, y, w, 7, "#ffffffcc");
  ro(x, y, w, h, "#00000055", 2);
  rr(x + 8, y + 22, w - 16, 12, "#fdfdfd");
  if (frost) {  // 霜。輪郭がぼやけて数えにくくなる
    rr(x, y, w, h, "rgba(226,240,248,0.42)");
    for (let i = 0; i < 9; i++) {
      const fx = x + ((i * 37) % (w - 6)), fy = y + ((i * 53) % (h - 6));
      rr(fx, fy, 3, 3, "rgba(255,255,255,0.75)");
    }
  }
}

  for (let i = 0; i < n; i++) {
    const x = startX + i * (bwid + gap), y = by + 56;

function drawBox(x, y, w, h, open, contents, col, name) {
  if (!open) {
    rr(x, y, w, h, "#b08c5e");

    rr(x, y, w, 10, "#9a7a50");
    rr(x + w / 2 - 1, y + 10, 2, h - 10, "#a8864e");
    rr(x + 12, y + h / 2 - 15, w - 24, 30, "#eee4d0");
    txt(name, x + w / 2, y + h / 2 - 8, { size: 13, color: "#4a4038", align: "center" });
    txt("とじている", x + w / 2, y + h + 8, { size: 14, color: C.sumi[500], align: "center" });
  } else {
    rr(x - 8, y - 16, w / 2 + 6, 18, "#9a7a50");
    rr(x + w / 2 + 2, y - 16, w / 2 + 6, 18, "#9a7a50");
    rr(x, y, w, h, "#8a6a44");
    rr(x + 6, y + 6, w - 12, h - 12, "#2e2518");
    if (contents === 0) {
      txt("からっぽ", x + w / 2, y + h / 2 - 10, { size: 18, color: C.sumi[500], align: "center" });
    } else {
      for (let i = 0; i < contents; i++) {
        const r = Math.floor(i / 3), c = i % 3;
        const px = x + 14 + c * 42 + (r % 2 ? 7 : 0), py = y + h - 36 - r * 32;
        rr(px, py, 36, 28, col);
        rr(px, py, 36, 4, "#ffffffbb");
        ro(px, py, 36, 28, "#00000055", 2);
      }
    }
    txt("あけた", x + w / 2, y + h + 8, { size: 14, color: C.wasabi[300], align: "center" });
  }
}

}
function drawVat(x, y, w, h, fill) {
  rr(x, y, w, h, "#aab0ba");
  rr(x + 5, y + 5, w - 10, h - 10, "#5c626c");
  const fh = Math.round((h - 16) * fill);
  rr(x + 6, y + h - 6 - fh, w - 12, fh, "#a8742c");
  rr(x + 6, y + h - 6 - fh, w - 12, 3, "#c69244");
  ro(x, y, w, h, "#474d56", 3);
}
function drawPot(x, y, w, h, fill) {
  rr(x - 12, y + 18, 12, 10, "#8a9098");   // とって
  rr(x + w, y + 18, 12, 10, "#8a9098");
  rr(x, y, w, h, "#9aa0aa");
  rr(x + 6, y + 8, w - 12, h - 14, "#3a3026");
  const fh = Math.round((h - 26) * fill);
  rr(x + 7, y + h - 7 - fh, w - 14, fh, "#a8742c");
  rr(x + 7, y + h - 7 - fh, w - 14, 3, "#c69244");
  ro(x, y, w, h, "#5a6069", 3);
}

/* ---- 07 れいとうこ（霜で見づらい） ---- */
function drawFreezerScene() {
  const ing = byPlace("freezer")[0];
  rr(0, 0, W, H, "#0d1218");
  const bx = 100, by = 80, bw = W - 200, bh = 250;
  rr(bx - 14, by - 14, bw + 28, bh + 28, C.steelLo);
  rr(bx - 8, by - 8, bw + 16, bh + 16, "#c8d4de");
  rr(bx, by, bw, bh, "#18242c");
  ro(bx, by, bw, bh, "#0c1218", 3);
  for (let i = 0; i < 46; i++) {
    rr(bx + 3, by + 3 + i, bw - 6, 1, "rgba(180,224,240," + (0.13 - i * 0.0028) + ")");
  }
  txt("れいとうこ の なか", W / 2, 44, { size: 19, color: "#a8d8e8", bold: true, align: "center" });
  txt(ing.name, bx + 20, by + 10, { size: 17, color: C.sumi[300] });

  const shelfY = by + bh - 20;
  rr(bx + 8, shelfY, bw - 16, 8, C.steelLo);
  const layout = [[0,0],[46,6],[88,1],[132,8],[176,2],[219,7],[262,0],[306,5],[348,2]];
  for (let i = 0; i < ing.pieces; i++) {
    const o = layout[i % layout.length];
    drawBag(bx + 28 + o[0], shelfY - 62 + o[1], 42, 62, ing.color, true);
  }
  // 庫内の白い冷気
  rr(bx + 3, by + 3, bw - 6, bh - 6, "rgba(210,236,248,0.10)");

  drawMessageBox(["霜で まっ白。ふくろの さかいめが わかりにくい。"], "#a8d8e8");
  drawKeyHints([["X", "とじる"]], H - 40);
}

/* ---- 08 パソコン（ここでしか依頼は見られない） ---- */
function drawPC() {
  rr(0, 0, W, H, "#242838");
  const mx = 24, my = 14, mw = W - 48, mh = H - 62;
  rr(mx - 8, my - 8, mw + 16, mh + 16, "#3e4252");
  rr(mx - 4, my - 4, mw + 8, mh + 8, "#181a22");
  rr(mx, my, mw, mh, C.sumi[50]);

  rr(mx, my, mw, 58, C.white);
  txt("在庫 ＞ カウント依頼", mx + 16, my + 8, { size: 14, color: C.sumi[500] });
  txt("在庫カウント  ドット亭", mx + 16, my + 26, { size: 23, color: C.sumi[900], bold: true });
  txt("推定在庫 計算時刻", mx + mw - 320, my + 10, { size: 13, color: C.sumi[500] });
  txt("9:30", mx + mw - 320, my + 28, { size: 16, color: C.sumi[900], bold: true });
  txt("売上 連携時刻", mx + mw - 170, my + 10, { size: 13, color: C.sumi[500] });
  txt("8:00", mx + mw - 170, my + 28, { size: 16, color: C.sumi[900], bold: true });
  rr(mx, my + 58, mw, 2, C.sumi[200]);

  const ny = my + 66, done = remaining() === 0;
  rr(mx + 12, ny, mw - 24, 46, done ? C.wasabi[50] : C.mikan[50]);
  ro(mx + 12, ny, mw - 24, 46, done ? C.wasabi[500] : C.mikan[300], 2);
  if (done) {
    txt("お疲れさまでした！ 発注に すすめます。", mx + 32, ny + 13,
        { size: 17, color: C.wasabi[700], bold: true });
  } else {
    txt("在庫カウントが必要な食材/備品が " + remaining() + " 件あります。",
        mx + 32, ny + 5, { size: 17, color: C.mikan[700], bold: true });
    txt("現在の在庫数を確認し、本日の納品を含めた在庫数を入力してください。",
        mx + 32, ny + 26, { size: 14, color: C.sumi[700] });
  }
  txt("残り", mx + 14, ny + 56, { size: 15, color: C.sumi[900], bold: true });
  txt(String(remaining()), mx + 46, ny + 50, { size: 21, color: C.wasabi[600], bold: true });
  txt("件", mx + 68, ny + 56, { size: 15, color: C.sumi[900], bold: true });

  let ry = ny + 80;
  INGREDIENTS.forEach((ing, i) => {
    const v = G.day.inputs[ing.id] || 0;
    const conf = !!G.day.confirmed[ing.id];
    const warn = !conf && warnsAt(v, ing.theo);
    const cur = (G.pc.row === i);
    const rh = warn ? 64 : 48;

    rr(mx + 12, ry, mw - 24, rh, warn ? C.tarako[50] : conf ? C.wasabi[50] : C.white);
    if (cur) ro(mx + 12, ry, mw - 24, rh, C.mikan[400], 3);
    else if (warn) ro(mx + 12, ry, mw - 24, rh, C.tarako[500], 2);
    else rr(mx + 12, ry + rh - 2, mw - 24, 2, C.sumi[100]);

    rr(mx + 22, ry + 8, 30, 30, ing.color);
    ro(mx + 22, ry + 8, 30, 30, C.sumi[300], 2);
    txt(ing.name, mx + 62, ry + (ing.delivery ? 5 : 13), { size: 17, color: C.sumi[900], bold: true });
    if (ing.delivery) {
      txt("本日" + ing.delivery + ing.unit + " 納品予定", mx + 62, ry + 27,
          { size: 13, color: C.wasabi[600] });
    }
    txt("理由: " + ing.reason, mx + 330, ry + 15, { size: 13, color: C.sumi[500] });

    const stx = mx + mw - 300, stw = 160;
    rr(stx, ry + 9, stw, 30, C.white);
    ro(stx, ry + 9, stw, 30, warn ? C.tarako[500] : cur ? C.mikan[400] : C.sumi[300], 2);
    rr(stx + 2, ry + 11, 28, 26, C.sumi[50]);
    txt("−", stx + 16, ry + 14, { size: 17, color: C.sumi[700], bold: true, align: "center" });
    rr(stx + stw - 30, ry + 11, 28, 26, C.sumi[50]);
    txt("＋", stx + stw - 16, ry + 14, { size: 17, color: C.sumi[700], bold: true, align: "center" });
    txt(num(v) + ing.unit, stx + stw - 38, ry + 14,
        { size: 17, color: C.sumi[900], bold: true, align: "right" });

    const bx2 = mx + mw - 126;
    if (conf) {
      txt("✓ 確定済み", bx2, ry + 14, { size: 15, color: C.wasabi[600], bold: true });
    } else {
      rr(bx2, ry + 9, 100, 30, C.wasabi[500]);
      ro(bx2, ry + 9, 100, 30, C.wasabi[700], 2);
      txt("在庫確定", bx2 + 50, ry + 15, { size: 15, color: C.white, bold: true, align: "center" });
    }
    if (warn) {
      txt("⚠ " + warn, mx + mw - 34, ry + 42,
          { size: 14, color: C.tarako[600], bold: true, align: "right" });
    }
    ry += rh + 3;
  });

  rr(0, H - 40, W, 40, "#0e1018");
  txt("メモは とれない", 16, H - 30, { size: 15, color: C.sumi[600] });
  txt("↑↓ 行 ／ ←→ すうじ ／ Enter 在庫確定 ／ X せきを はなれる", W - 16, H - 30,
      { size: 15, color: C.sumi[400], align: "right" });

  if (G.pc.dialog) drawWarningDialog();
}
function drawWarningDialog() {
  const d = G.pc.dialog;
  rr(0, 0, W, H, "rgba(0,0,0,0.55)");
  const dw = 640, dh = 272, dx = (W - dw) / 2, dy = 126;
  rr(dx, dy, dw, dh, C.white);
  ro(dx, dy, dw, dh, C.tarako[500], 4);
  rr(dx, dy, dw, 44, C.tarako[500]);
  txt("⚠  けいこく", dx + 18, dy + 12, { size: 20, color: C.white, bold: true });

  txt(d.msg, dx + 28, dy + 68, { size: 23, color: C.tarako[600], bold: true });
  txt(d.ing.name + "　システム想定 " + num(d.ing.theo) + d.ing.unit +
      "　→　入力 " + num(G.day.inputs[d.ing.id]) + d.ing.unit,
      dx + 28, dy + 108, { size: 17, color: C.sumi[900] });
  txt("ほんとうに その かず で あっていますか？", dx + 28, dy + 134, { size: 16, color: C.sumi[700] });

  ["数えなおす", "このまま確定"].forEach((label, i) => {
    const bw2 = 200, bx = dx + 28 + i * (bw2 + 20), by = dy + 176, on = (d.choice === i);
    rr(bx, by, bw2, 44, i === 0 ? C.sumi[100] : C.tarako[500]);
    ro(bx, by, bw2, 44, on ? C.sumi[900] : (i === 0 ? C.sumi[400] : C.tarako[700]), on ? 4 : 2);
    txt(label, bx + bw2 / 2, by + 12,
        { size: 17, bold: true, align: "center", color: i === 0 ? C.sumi[900] : C.white });
  });
  txt("※ 数えなおすと、また 歩いて 見にいくことになる", dx + 28, dy + 234,
      { size: 14, color: C.mikan[500] });
}

/* ---- 09 リザルト ---- */
function drawResult() {
  const r = G.result;
  rr(0, 0, W, H, "#12141e");
  for (let i = 0; i < W; i += 24) rr(i, 0, 12, H, "#141724");

  rr(0, 0, W, 50, "#0c0e16");
  txt("しゅうぎょう！", W / 2, 12, { size: 24, color: C.mikan[300], bold: true, align: "center" });

  const px = 40, py = 66;
  txt("こたえあわせ", px, py, { size: 15, color: C.sumi[500] });
  r.detail.forEach((d, i) => {
    const y = py + 26 + i * 28;
    const ok = (d.input === d.expected);
    txt(d.name, px, y, { size: 16, color: C.sumi[300] });
    txt("入力 " + num(d.input) + d.unit, px + 220, y, { size: 16, color: C.white, bold: true });
    txt("正解 " + num(d.expected) + d.unit, px + 350, y,
        { size: 16, color: ok ? C.wasabi[300] : C.tarako[300], bold: true });
    txt(ok ? "ぴったり" : (d.input > d.expected ? "多い" : "足りない"), px + 480, y,
        { size: 15, color: ok ? C.wasabi[300] : C.mikan[300] });
  });

  const qx = 620;
  [["せいかくさ", r.accuracy + " %", r.accuracy >= 80 ? C.wasabi[300] : C.mikan[300]],
   ["スキップりつ", r.skipRate + " %", r.skipRate > 0 ? C.tarako[300] : C.wasabi[300]],
   ["しょようじかん", Math.floor(r.seconds / 60) + "分" + (r.seconds % 60) + "秒", C.white],
   ["あるいた きょり", r.walked + " ドット", C.sumi[400]],
  ].forEach((row, i) => {
    const y = py + 26 + i * 28;
    txt(row[0], qx, y, { size: 15, color: C.sumi[500] });
    txt(row[1], W - 40, y - 2, { size: 18, color: row[2], bold: true, align: "right" });
  });

  const by = 228;
  rr(40, by, W - 80, 44, "#1c1414");
  ro(40, by, W - 80, 44, C.tarako[500], 2);
  txt("ランク", 60, by + 13, { size: 15, color: C.sumi[400] });
  txt(r.rank, 120, by + 7, { size: 25, color: C.tarako[300], bold: true });
  txt(r.rank === "S" ? "「完璧。ただし誰も見ていない」"
    : r.rank === "A" ? "「よく数えた」"
    : r.rank === "B" ? "「まあ発注はできる」"
    : "「とりあえず 発注は できる」", 160, by + 13, { size: 17, color: C.sumi[300] });

  txt("あしたも " + INGREDIENTS.length + "件 きます。", W / 2, 296,
      { size: 20, color: C.mikan[300], bold: true, align: "center" });
  txt("— これが 毎日 おきている —", W / 2, 328, { size: 16, color: C.sumi[500], align: "center" });

  if (storageOK) {
    txt("きろくしました（れんぞく " + G.save.streak + "日）", W / 2, 372,
        { size: 15, color: C.wasabi[300], align: "center" });
  }
  drawKeyHints([["Enter", "タイトルへ"]], H - 40);
}

/* =========================================================================
   メインループ
   ========================================================================= */
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now; G.t += dt;

  if (G.scene === "room") updateRoom(dt);

  ctx.clearRect(0, 0, W, H);
  switch (G.scene) {
    case "title":    drawTitle(); break;
    case "briefing": drawBriefing(); break;
    case "room":     drawRoom(); break;
    case "fridge":   drawFridgeScene();  drawHUD(); break;
    case "shelf":    drawShelfScene();   drawHUD(); break;
    case "prep":     drawPrepScene();    drawHUD(); break;
    case "freezer":  drawFreezerScene(); drawHUD(); break;
    case "pc":       drawPC(); break;
    case "result":   drawResult(); break;
  }
  requestAnimationFrame(frame);
}

G.save = loadSave();
armNotify();   // すでに許可ずみなら、起動1分後の通知をここで仕込む
cv.focus();
requestAnimationFrame(frame);
</script>
