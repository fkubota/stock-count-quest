<script>
"use strict";
/* =========================================================================
   在庫カウントクエスト / STOCK COUNT QUEST

   飲食店の在庫カウントが、なぜめんどくさいのかを体験するゲーム。

   設計の軸:
   - 何を数えるのかは「パソコンの前」でしか分からない
   - どこに何があるかは教えない。店じゅうを歩いて自分で探す
   - 置いてあるもののほとんどは今日のカウント対象ではない（探すのが仕事）
   - 同じ品目が2か所に分かれていることがある
   - 遊ぶたびに、品目も数も置き場所も変わる
   - 余計な説明はしない。察して数える

   方針: 外部依存ゼロ（CDN・fetch・外部画像・音声ファイルを一切使わない）
   ========================================================================= */

/* ---------------------------------------------------------------- 基本 */
const cv = document.getElementById("g");
const ctx = cv.getContext("2d");
const S = 3, AW = 320, AH = 180, W = AW * S, H = AH * S;
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif';

const C = {
  white:"#ffffff",
  sumi:{50:"#f7f7f7",100:"#e8e8e8",200:"#d4d4d4",300:"#bababa",400:"#a1a1a1",
        500:"#868686",600:"#6f6f6f",700:"#585858",800:"#414141",900:"#1b1b1b"},
  wasabi:{50:"#f0fcfa",300:"#82dad0",500:"#16a595",600:"#008f76",700:"#006e5c"},
  mikan:{50:"#fff9f0",100:"#fff0d6",300:"#fcc862",400:"#f5a820",500:"#e88c00",700:"#a85800"},
  tarako:{50:"#fff4f2",100:"#feebe8",300:"#f9a49c",500:"#e84040",600:"#d02424",700:"#ae1a1a"},
  floorA:"#606876", floorB:"#545c6a", floorLn:"#424856",
  wall:"#363a4a", wallHi:"#484e60", wallLo:"#262934",
  steel:"#aab2be", steelHi:"#ced4de", steelLo:"#7a8290",
  wood:"#966c42", woodLo:"#745230", uiFg:"#ecf0f8",
};

function pr(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x)*S,Math.round(y)*S,Math.round(w)*S,Math.round(h)*S); }
function rr(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function ro(x,y,w,h,c,t){ t=t||2; ctx.strokeStyle=c; ctx.lineWidth=t; ctx.strokeRect(x+t/2,y+t/2,w-t,h-t); }
function txt(s,x,y,o){
  o=o||{}; const size=o.size||16;
  ctx.font=(o.bold?"bold ":"")+size+"px "+FONT;
  ctx.textAlign=o.align||"left"; ctx.textBaseline=o.base||"top";
  ctx.fillStyle=o.color||C.uiFg; ctx.fillText(s,x,y);
}
function tw(s,size,bold){ ctx.font=(bold?"bold ":"")+(size||16)+"px "+FONT; return ctx.measureText(s).width; }
function stamp(x,y,rows,pal){
  for(let j=0;j<rows.length;j++) for(let i=0;i<rows[j].length;i++){
    const ch=rows[j][i]; if(ch!==".") pr(x+i,y+j,1,1,pal[ch]);
  }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>(Math.round(v*10)/10).toString();

/* ---------------------------------------------------------------- 乱数（毎回ちがう店にする） */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
let RND = mulberry32(1);
const ri=(a,b)=>a+Math.floor(RND()*(b-a+1));          // a..b の整数
const pick=arr=>arr[Math.floor(RND()*arr.length)];
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(RND()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------------------------------------------------------------- 音
   音声ファイルは置けないので、WebAudio でその場で合成する。
   ブラウザの制約で、最初のキー入力があるまで音は鳴らせない。 */
let actx=null, musicGain=null, sfxGain=null;
let soundOn=true;          // B キーで 音楽も効果音もまとめて切る
function audio(){
  if(actx === false) return null;              // 一度失敗したら以後あきらめる
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ actx = false; return null; }
    try { actx = new AC(); } catch(e){ actx = false; return null; }
    musicGain = actx.createGain(); musicGain.gain.value = 0.055; musicGain.connect(actx.destination);
    sfxGain   = actx.createGain(); sfxGain.gain.value   = 0.16;  sfxGain.connect(actx.destination);
  }
  try { if(actx.state === "suspended") actx.resume(); } catch(e){}
  return actx;
}
function tone(freq, dur, type, vol, delay, dest){
  if(!soundOn) return;
  const a = audio(); if(!a) return;
  const t0 = a.currentTime + (delay||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, delay){
  if(!soundOn) return;
  const a = audio(); if(!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = vol || 0.2;
  src.connect(g); g.connect(sfxGain);
  src.start(a.currentTime + (delay||0));
}
const SFX = {
  move:  () => tone(640, 0.05, "square", 0.12),
  step:  () => tone(150, 0.04, "triangle", 0.10),
  open:  () => { noise(0.16, 0.22); tone(180, 0.10, "triangle", 0.18); },
  close: () => tone(130, 0.09, "triangle", 0.16),
  door:  () => { tone(220, 0.07, "triangle", 0.18); tone(165, 0.12, "triangle", 0.16, 0.07); },
  tick:  () => tone(880, 0.04, "square", 0.10),
  confirm:()=> { tone(660, 0.08, "square", 0.22); tone(990, 0.12, "square", 0.20, 0.07); },
  warn:  () => { tone(190, 0.22, "sawtooth", 0.22); tone(150, 0.26, "sawtooth", 0.20, 0.10); },
  done:  () => [0,1,2,3].forEach(i => tone([523,659,784,1046][i], 0.18, "square", 0.22, i*0.10)),
};

/* --- BGM: 16ステップのループを合成する --- */
const BGM = {
  timer: null, step: 0,
  bass: [0,0,7,0, 5,5,0,0, 3,3,10,3, 5,5,7,7],
  lead: [12,null,15,null, 19,null,15,null, 17,null,15,null, 12,null,10,null],
  root: 110,
};
function bgmStart(){
  if(!audio() || BGM.timer) return;
  BGM.timer = setInterval(() => {
    if(!soundOn) return;
    const i = BGM.step % 16;
    const b = BGM.bass[i];
    if(b !== null) tone(BGM.root * Math.pow(2, b/12), 0.18, "triangle", 0.5, 0, musicGain);
    const l = BGM.lead[i];
    if(l !== null) tone(BGM.root * 2 * Math.pow(2, l/12), 0.14, "square", 0.22, 0, musicGain);
    BGM.step++;
  }, 215);
}
function soundToggle(){ soundOn = !soundOn; if(soundOn) bgmStart(); }

/* ---------------------------------------------------------------- セーブ */
const SAVE_KEY="stock-count-quest/v2";
let storageOK=true;
function todayStr(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
const defaultSave=()=>({lastPlayedDate:null,streak:0,totalCounted:0,days:[]});
function loadSave(){
  try{ localStorage.setItem(SAVE_KEY+"/p","1"); localStorage.removeItem(SAVE_KEY+"/p"); }
  catch(e){ storageOK=false; return defaultSave(); }
  try{ const raw=localStorage.getItem(SAVE_KEY);
       return raw?Object.assign(defaultSave(),JSON.parse(raw)):defaultSave(); }
  catch(e){ return defaultSave(); }
}
function writeSave(){ if(!storageOK) return;
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(G.save)); }catch(e){ storageOK=false; } }

/* ---------------------------------------------------------------- 保管場所 */
const PLACES = {
  fridge:   { label:"れいぞうこ",         room:"kitchen",  kinds:["pieces","liquid","pile","weigh"] },
  shelf:    { label:"じょうおんだな",     room:"kitchen",  kinds:["boxes","liquid"] },
  prep:     { label:"さぎょうだい",       room:"kitchen",  kinds:["weigh"] },
  freezer:  { label:"れいとうこ",         room:"backyard", kinds:["frozen"] },
  backshelf:{ label:"バックヤードのたな", room:"backyard", kinds:["boxes","pieces","pile"] },
};

/* ---------------------------------------------------------------- 品目カタログ */
const CATALOG = [
  {id:"pork",     name:"ぶたバラ肉",     unit:"袋",    color:"#e8a294", kind:"pieces", at:["fridge"]},
  {id:"chicken",  name:"とりもも肉",     unit:"袋",    color:"#eebba2", kind:"pieces", at:["fridge"]},
  {id:"tofu",     name:"とうふ",         unit:"丁",    color:"#e6e2cc", kind:"pieces", shape:"carton", at:["fridge"]},
  {id:"egg",      name:"たまご",         unit:"パック", color:"#e9d9a8", kind:"pieces", shape:"carton", at:["fridge"]},
  {id:"cabbage",  name:"キャベツ",       unit:"玉",    color:"#a9ca88", kind:"pile", shape:"round",  at:["fridge","backshelf"]},
  {id:"onion",    name:"たまねぎ",       unit:"個",    color:"#c9a05e", kind:"pile", shape:"round",  at:["backshelf"]},
  {id:"pepper",   name:"ピーマン",       unit:"個",    color:"#4f9e49", kind:"pile", shape:"pepper", at:["fridge","backshelf"]},
  {id:"tomato",   name:"トマト",         unit:"個",    color:"#d6483c", kind:"pile", shape:"round",  at:["fridge"]},
  {id:"jagaimo",  name:"じゃがいも",     unit:"個",    color:"#caa268", kind:"pile", shape:"ellipse",at:["backshelf"]},
  {id:"potato",   name:"れいとうポテト", unit:"袋",    color:"#e8d7a8", kind:"frozen", at:["freezer"]},
  {id:"shrimp",   name:"れいとうエビ",   unit:"袋",    color:"#f0b6a6", kind:"frozen", at:["freezer"]},
  {id:"gyoza",    name:"れいとうギョウザ",unit:"袋",   color:"#dcc9a0", kind:"frozen", at:["freezer"]},
  {id:"oil",      name:"サラダ油",       unit:"L",     color:"#ecc85e", kind:"liquid", at:["fridge","shelf"]},
  {id:"sake",     name:"りょうり酒",     unit:"L",     color:"#d8c98a", kind:"liquid", at:["shelf"]},
  {id:"mirin",    name:"みりん",         unit:"L",     color:"#d8a860", kind:"liquid", at:["shelf"]},
  {id:"wakame",   name:"かんそうわかめ", unit:"袋",    color:"#8fae84", kind:"boxes",  at:["shelf","backshelf"]},
  {id:"chopstick",name:"わりばし",       unit:"膳",    color:"#dcc89a", kind:"boxes",  at:["backshelf","shelf"]},
  {id:"napkin",   name:"ナプキン",       unit:"箱",    color:"#e4e4e4", kind:"boxes",  at:["backshelf"]},
  {id:"dashi",    name:"和風だし",       unit:"g", color:"#b08848", kind:"weigh", vessel:"pot", at:["prep"]},
  {id:"demi",     name:"デミグラス",     unit:"g", color:"#a06030", kind:"weigh", vessel:"pot", at:["prep"]},
  {id:"sauce",    name:"じかせいダレ",   unit:"g", color:"#8a5c34", kind:"weigh", vessel:"pot", at:["prep"]},
  {id:"currypot", name:"カレー",         unit:"g", color:"#b8701c", kind:"weigh", vessel:"pot", at:["prep"]},
  {id:"rice",     name:"たきあがりライス",unit:"g",color:"#e6dcc0", kind:"weigh", vessel:"pot", at:["prep"]},
  {id:"soup",     name:"スープ",         unit:"g", color:"#c8a858", kind:"weigh", vessel:"pot", at:["prep"]},
  {id:"meat",     name:"ミートソース",   unit:"g",     color:"#a8402c", kind:"weigh", vessel:"tupper", at:["fridge","prep"]},
  {id:"white",    name:"ホワイトソース", unit:"g",     color:"#dcd4bc", kind:"weigh", vessel:"tupper", at:["fridge","prep"]},
  {id:"tane",     name:"ハンバーグのタネ",unit:"g",    color:"#b07a58", kind:"weigh", vessel:"tupper", at:["fridge","prep"]},
  {id:"tartar",   name:"タルタルソース", unit:"g",     color:"#ece2bc", kind:"weigh", vessel:"tupper", at:["fridge","prep"]},
];

const FILLS = [1, 1, 0.92, 0.85, 0.78, 0.7, 0.62, 0.55, 0.45, 0.38, 0.3, 0.22, 0.15, 0.08];
const PART  = [0.88, 0.8, 0.72, 0.64, 0.55, 0.46, 0.38, 0.3, 0.22, 0.14];   // 使いかけ
// 入れ物: 容量(g) と 空のときの重さ(g)
const VESSEL = {
  tupper:{ cap:[800,1400,2000],     tare:[180,320,460],      slots:1 },
  vat:   { cap:[1600,2400,3200],    tare:[600,820,1050],     slots:1 },
  pot:   { cap:[6000,9000,12000],   tare:[2400,3000,3600],   slots:2 },
  // 野菜は容器に入れず、抱えて運ぶ。何玉あっても一度に持てる
  veg:   { cap:[0,0,0],             tare:[0,0,0],            slots:1 },
};
// 野菜 1個ぶんの、だいたいの重さ。ここから個体差をつけるので、数えて掛け算しても当たらない
const PIECE_G = { cabbage:1150, onion:210, pepper:35, tomato:180, jagaimo:140 };
function makeCon(shape,size,fill){
  const V=VESSEL[shape];
  return { shape, size, tare:V.tare[size], fill,
           net: Math.round(V.cap[size]*fill/100)*100 };
}

// ひとつの保管場所に置かれた、ある品目のかたまり
function makeLot(item){
  const lot = { itemId:item.id, kind:item.kind };
  if(item.kind==="pile"){
    lot.pieces = ri(6, 14);
    lot.layer = [];
    for(let i=0;i<lot.pieces;i++) lot.layer.push(i<Math.ceil(lot.pieces*0.45)?0:(i<Math.ceil(lot.pieces*0.78)?1:2));
    // 野菜はいつでも抱えて はかり台へ持っていける。
    // 今日の単位が「個」なら、持っていっても ただの無駄骨になる
    let sum=0;
    for(let i=0;i<lot.pieces;i++) sum += PIECE_G[item.id]*(0.78+RND()*0.44);   // 1個ずつ重さがちがう
    lot.cons = [{ shape:"veg", size:0, tare:0, fill:1,
                  net: Math.max(100, Math.round(sum/100)*100) }];
  } else if(item.kind==="pieces" || item.kind==="frozen"){
    lot.pieces = ri(3, 10);
  } else if(item.kind==="liquid"){
    lot.canSize = pick([4, 4, 1.8]);
    lot.cans = [];
    const n = ri(2, 4);
    for(let i=0;i<n;i++) lot.cans.push(1);          // 未開封は満タン
    // 開封ずみは1本だけ。入力が0.5刻みなので、合計が0.5の倍数になる残量にする
    const full = (n-1)*lot.canSize;
    const lo = Math.ceil((full + 0.10*lot.canSize)*2)/2;
    const hi = Math.floor((full + 0.95*lot.canSize)*2)/2;
    const want = Math.round((full + pick(PART)*lot.canSize)*2)/2;
    const target = Math.min(Math.max(want, lo), hi);
    lot.cans[Math.floor(RND()*n)] = (target - full)/lot.canSize;
  } else if(item.kind==="boxes"){
    lot.boxes = [];
    const n = ri(2, 4), full = ri(5, 9);
    for(let i=0;i<n;i++) lot.boxes.push(full);      // 未開封の箱は満杯
    lot.boxes[Math.floor(RND()*n)] = ri(0, full-1); // あけかけは1箱だけ
  } else if(item.kind==="weigh"){
    // はかりは「中身＋容器」の重さを表示する。使いかけは かならず ひとつだけ
    lot.cons=[];
    if(item.vessel==="pot"){
      const n=ri(2,3);
      for(let i=0;i<n;i++) lot.cons.push(makeCon("vat", ri(0,2), 1));
      lot.cons.push(makeCon("pot", ri(0,2), 1));
    } else {
      const n=ri(2,3);
      for(let i=0;i<n;i++) lot.cons.push(makeCon("tupper", ri(0,2), 1));
    }
    const u=Math.floor(RND()*lot.cons.length);
    const c=lot.cons[u];
    lot.cons[u]=makeCon(c.shape,c.size,pick(PART));
  }
  return lot;
}
function lotAmount(lot){
  if(lot.weighMode) return lot.cons[0].net;
  if(lot.kind==="pieces"||lot.kind==="frozen"||lot.kind==="pile") return lot.pieces;
  if(lot.kind==="liquid") return lot.cans.reduce((a,b)=>a+b,0) * lot.canSize;
  if(lot.kind==="boxes")  return lot.boxes.reduce((a,b)=>a+b,0);
  if(lot.kind==="weigh")  return lot.cons.reduce((a,c)=>a+c.net,0);
  return 0;
}

/* --- その日の店をつくる --- */
function buildStore(){
  const store = {};                 // placeId -> [lot]
  for(const p in PLACES) store[p] = [];
  const used = {};                  // itemId -> [placeId]

  // 各保管場所に 2〜3 品目ずつ置く
  const put = (p,it) => { store[p].push(makeLot(it)); used[it.id]=[p]; };
  for(const p in PLACES){
    const kinds = PLACES[p].kinds;
    if(p==="prep"){
      // 作業台には必ず寸胴の仕掛品を置く。そのうえで、量るタッパーを足す
      const vats = shuffled(CATALOG.filter(i=>i.vessel==="pot" && !used[i.id]));
      const wgs  = shuffled(CATALOG.filter(i=>i.vessel==="tupper" && i.at.indexOf(p)>=0 && !used[i.id]));
      const nv = Math.min(vats.length, ri(2,3));
      for(let i=0;i<nv;i++) put(p, vats[i]);
      const nw = Math.min(wgs.length, Math.max(1, 4-nv));
      for(let i=0;i<nw;i++) put(p, wgs[i]);
      continue;
    }
    const cand = shuffled(CATALOG.filter(i => kinds.indexOf(i.kind)>=0 && i.at.indexOf(p)>=0 && !used[i.id]));
    const n = Math.min(cand.length, ri(3,4));
    for(let i=0;i<n;i++) put(p, cand[i]);
  }
  // 1〜2品目は、別の場所にも分けて保管されている
  const splitable = shuffled(Object.keys(used).filter(id=>{
    const it = CATALOG.find(x=>x.id===id);
    return it.at.length > 1 && it.at.some(p => used[id].indexOf(p)<0 && store[p].length < 4);
  }));
  for(const id of splitable.slice(0, ri(1,2))){
    const it = CATALOG.find(x=>x.id===id);
    const p2 = it.at.find(p => used[id].indexOf(p)<0 && store[p].length < 4);
    if(!p2) continue;
    store[p2].push(makeLot(it));
    used[id].push(p2);
  }
  return { store, used };
}

/* --- その日のカウント依頼をつくる --- */
function buildRequests(store, used){
  const ids = shuffled(Object.keys(used));
  // 2か所に分かれているものを必ず1つは混ぜる
  const multi = ids.filter(id => used[id].length > 1);
  const chosen = [];
  if(multi.length) chosen.push(multi[0]);
  for(const id of ids){ if(chosen.length>=4) break; if(chosen.indexOf(id)<0) chosen.push(id); }

  // 今日のぶんに かならず1件、「数えられるのに g で聞かれる」山積みを混ぜる。
  // 見た目も、持てるかどうかも変わらないので、パソコンの前に立つまで分からない。
  // ときどき出るくらいに戻したいときは、ここを RND() で間引く
  const piles = ids.filter(id => CATALOG.find(x=>x.id===id).kind==="pile");
  let weighId = piles.find(id => chosen.indexOf(id)>=0);
  if(!weighId && piles.length){
    weighId = piles[0];
    if(chosen.length>=4) chosen[chosen.length-1] = weighId;   // 1枠だけ入れ替える
    else chosen.push(weighId);
  }
  if(weighId) for(const p of used[weighId]) for(const lot of store[p])
    if(lot.itemId===weighId) lot.weighMode = true;

  const deliveryId = pick(chosen.filter(id=>{
    const k = CATALOG.find(x=>x.id===id).kind;
    return k==="pieces"||k==="frozen"||k==="boxes";
  }) || []);

  return chosen.map(id => {
    const it = CATALOG.find(x=>x.id===id);
    let base = 0, weighed = false;
    for(const p of used[id]) for(const lot of store[p]) if(lot.itemId===id){
      base += lotAmount(lot);
      if(lot.weighMode) weighed = true;
    }
    const unit = weighed ? "g" : it.unit;
    const delivery = (id===deliveryId) ? ri(1,3) : 0;
    const expected = Math.round((base + delivery)*10)/10;

    // システムの理論在庫。たまに当たっている（＝スキップしても正解になる）
    const r = RND();
    let theo;
    if(r < 0.25)      theo = expected;                                           // たまたま合っている
    else if(r < 0.62) theo = Math.max(1, Math.round(expected * (1.6 + RND()*1.0)));
    else              theo = Math.max(1, Math.round(expected * (0.22 + RND()*0.32)));

    // はじめの数字も、入力の刻みに合わせておく。
    // そうしないと ＋－を何回おしても 正解にたどりつけない
    const st = (unit==="g") ? 100 : (it.kind==="liquid") ? 0.5 : 1;
    theo = Math.max(st, Math.round(theo/st)*st);
    return { id, name:it.name, unit, color:it.color, kind:it.kind,
             places:used[id].slice(), expected, delivery, theo };
  });
}

const G = { scene:"title", room:"kitchen", save:null, day:null, t:0 };

function newDay(){
  RND = mulberry32((Date.now() ^ (Math.random()*1e9|0)) >>> 0);
  const built = buildStore();
  const reqs  = buildRequests(built.store, built.used);
  return {
    store: built.store, reqs,
    inputs:{}, touched:{}, confirmed:{}, opened:{}, carry:[],  // carry: {place,li,bi}
    seenList:false, skips:0, walked:0, startedAt:Date.now(),
  };
}
const remaining = () => G.day.reqs.filter(r => !G.day.confirmed[r.id]).length;
const reqOf = id => G.day.reqs.find(r => r.id === id);
const CARRY_MAX = 4;   // 枠。寸胴は2枠ぶん
const conOf = c => G.day.store[c.place][c.li].cons[c.bi];
const carryUsed = () => G.day.carry.reduce((a,c)=>a+VESSEL[conOf(c).shape].slots,0);
const selKey = e => e.t+":"+e.li+":"+e.bi;
const carryKey = c => c.place+":"+c.li+":"+c.bi;
// いま選んでいるものに対してできること
// 画面上の位置を見て、おした向きにある一番近いものへ移る
function moveCursor(v,dx,dy){
  const a=v.rects[selKey(v.sel[v.cursor])];
  if(!a){ v.cursor=(v.cursor+(dx+dy)+v.sel.length)%v.sel.length; SFX.move(); return; }
  const ax=a.x+a.w/2, ay=a.y+a.h/2;
  let best=-1, score=Infinity;
  v.sel.forEach((e,i)=>{
    if(i===v.cursor) return;
    const r=v.rects[selKey(e)]; if(!r) return;
    const ddx=(r.x+r.w/2)-ax, ddy=(r.y+r.h/2)-ay;
    if(dx){ if(Math.sign(ddx)!==dx || Math.abs(ddx)<4) return; if(Math.abs(ddy)>Math.abs(ddx)*1.8) return; }
    if(dy){ if(Math.sign(ddy)!==dy || Math.abs(ddy)<4) return; if(Math.abs(ddx)>Math.abs(ddy)*2.4) return; }
    const sc=Math.abs(ddx)*(dx?1:2.4)+Math.abs(ddy)*(dy?1:2.4);
    if(sc<score){ score=sc; best=i; }
  });
  if(best>=0){ v.cursor=best; SFX.move(); }
}
// Z は「見る」系、C は「持つ・のせる」系。同じものに両方あることがあるのでキーを分けた
function actionZ(e){
  if(!e) return null;
  if(e.t==="box")  return G.day.opened[G.view.place+":"+e.li+":"+e.bi] ? "しめる" : "あける";
  if(e.t==="pile"){
    if(carryIdx(G.view.place,e.li,0)>=0) return null;    // 抱えて持ち出し中は 見るものがない
    return G.view.peek[e.li] ? "もどす" : "おくを みる";
  }
  if(e.t==="look" && e.peek) return G.view.peek[e.li] ? "もどす" : "おくを みる";
  return null;
}
function actionC(e){
  if(!e) return null;
  // 野菜はいつでも持てる。持てるかどうかで その日の単位がバレないようにする
  if(e.t==="con" || e.t==="pile"){
    if(carryIdx(G.view.place,e.li,e.bi)>=0) return "たなに もどす";
    const need=VESSEL[G.day.store[G.view.place][e.li].cons[e.bi].shape].slots;
    return carryUsed()+need<=CARRY_MAX ? "もつ" : "手が いっぱい";
  }
  return null;
}
const carryIdx = (place,li,bi) =>
  G.day.carry.findIndex(c=>c.place===place&&c.li===li&&c.bi===bi);

const player = { x:200, y:124, dir:"up" };
let stepPhase = 0;

function nearObject(){
  for(const o of ROOMS[G.room].objects){
    const z=o.zone;
    if(player.x+5 >= z.x-6 && player.x+5 <= z.x+z.w+6 &&
       player.y+14 >= z.y-14 && player.y+14 <= z.y+z.h+22) return o;
  }
  return null;

function updateRoom(dt){
  const sp = 56*dt;
  let dx=0, dy=0;
  if(k("ArrowLeft")){ dx-=sp; player.dir="left"; }
  if(k("ArrowRight")){ dx+=sp; player.dir="right"; }
  if(k("ArrowUp")){ dy-=sp; player.dir="up"; }
  if(k("ArrowDown")){ dy+=sp; player.dir="down"; }
  if(dx||dy){
    const nx=clamp(player.x+dx,6,AW-16), ny=clamp(player.y+dy,FLOOR_TOP+4,FLOOR_BOTTOM-16);
    const moved=Math.abs(nx-player.x)+Math.abs(ny-player.y);
    G.day.walked+=moved; player.x=nx; player.y=ny;
    stepPhase+=moved;
    if(stepPhase>16){ stepPhase=0; SFX.step(); }
  }
}

/* ---------------------------------------------------------------- 保管場所をのぞく */
function openPlace(placeId){
  const sel=[];
  G.day.store[placeId].forEach((lot,li)=>{
    if(lot.kind==="boxes")      lot.boxes.forEach((_,bi)=>sel.push({t:"box",li,bi}));
    else if(lot.kind==="weigh") lot.cons.forEach((_,bi)=>sel.push({t:"con",li,bi}));
    else if(lot.kind==="pile")  sel.push({t:"pile",li,bi:0});
    // 目で数えるものは、奥の列を持ち上げて見られる。瓶は重なっていないので対象外
    else sel.push({t:"look",li,bi:0,peek:(lot.kind==="pieces"||lot.kind==="frozen")});
  });
  G.view = { place:placeId, sel, cursor:0, peek:{}, rects:{} };
  G.scene = "place";
  SFX.open();
}

/* ---------------------------------------------------------------- パソコン */
function openPC(){
  for(const r of G.day.reqs) if(G.day.inputs[r.id]===undefined) G.day.inputs[r.id]=r.theo;
  G.day.seenList = true;
  G.pc = { row:0, dialog:null };
  G.scene = "pc";
}
function warnsAt(v, theo){
  if(v===0 && theo>0) return "在庫数が0になっています";
  if(v > theo*1.5 || v < theo/1.6) return "想定在庫から大きく離れます";
  return null;
}
const stepOf = r => (r.unit==="g") ? 100 : (r.kind==="liquid") ? 0.5 : 1;
function stepValue(r,dir){
  G.day.confirmed[r.id]=false;
  const d=dir*stepOf(r);
  G.day.inputs[r.id]=Math.max(0,Math.round(((G.day.inputs[r.id]||0)+d)*10)/10);
  G.day.touched[r.id]=true; SFX.tick();
}
// 長おしで数字を連続して変えられるようにする
let repAcc=0, repDir=0;
function updatePC(dt){
  const p=G.pc;
  if(!p || p.dialog){ repDir=0; return; }
  const dir=k("ArrowLeft")?-1:(k("ArrowRight")?1:0);
  if(dir!==repDir){ repDir=dir; repAcc=-0.30; return; }   // 押しはじめは少し待つ
  if(!dir) return;
  repAcc+=dt;
  let guard=0;
  while(repAcc>=0.045 && guard++<40){ repAcc-=0.045; stepValue(G.day.reqs[p.row],dir); }
}
function confirmRow(r){
  G.day.confirmed[r.id]=true;
  if(!G.day.touched[r.id]) G.day.skips++;
  SFX.confirm();
  if(remaining()===0){ SFX.done(); finishDay(); }
}

/* ---------------------------------------------------------------- 結果 */
function finishDay(){
  const rs=G.day.reqs, n=rs.length;
  let errSum=0;
  for(const r of rs) errSum += Math.abs((G.day.inputs[r.id]||0) - r.expected) / Math.max(0.5, r.expected);
  const accuracy=Math.max(0,Math.round((1-errSum/n)*100));
  const skipRate=Math.round((G.day.skips/n)*1000)/10;
  const seconds=Math.round((Date.now()-G.day.startedAt)/1000);
  const rank=(accuracy>=95&&G.day.skips===0)?"S":accuracy>=80?"A":accuracy>=55?"B":"C";

  G.result={ accuracy,skipRate,seconds,rank,items:n,walked:Math.round(G.day.walked),
    detail: rs.map(r=>({ name:r.name, unit:r.unit, input:G.day.inputs[r.id]||0,
                         expected:r.expected, places:r.places.map(p=>PLACES[p].label) })) };

  const today=todayStr(), prev=G.save.lastPlayedDate;
  if(prev!==today){ const y=new Date(); y.setDate(y.getDate()-1);
    G.save.streak=(prev===todayStr(y))?G.save.streak+1:1; }
  G.save.lastPlayedDate=today; G.save.totalCounted+=n;
  G.save.days.unshift({date:today,accuracy,skipRate,seconds,rank});
  G.save.days=G.save.days.slice(0,30);
  writeSave();
  G.scene="result";
}

/* =========================================================================
   キー入力
   ========================================================================= */
function onKey(key){
  if(key==="b"){ soundToggle(); return; }

  switch(G.scene){
    case "title":
      if(key==="Enter"||key==="z"){ SFX.tick(); G.scene="briefing"; }
      return;

    case "briefing":
      if(key==="Enter"||key==="z"){
        G.day=newDay(); G.room="kitchen";
        player.x=200; player.y=124; player.dir="up";
        SFX.door(); G.scene="room";
      }
      return;

    case "room": {
      if(key!=="z") return;
      const o=nearObject(); if(!o) return;
      if(o.id==="door_b"){ G.room="backyard"; player.x=36; player.y=112; SFX.door(); return; }
      if(o.id==="door_k"){ G.room="kitchen";  player.x=140; player.y=112; SFX.door(); return; }
      if(o.id==="pc"){ SFX.tick(); openPC(); return; }
      if(o.id==="weighst"){ SFX.open(); G.ws={cursor:0,on:G.ws?G.ws.on:{}}; G.scene="weighst"; return; }
      openPlace(o.id);
      return;
    }

    case "weighst": {
      const carry=G.day.carry;
      if(key==="x"||key==="Escape"){ SFX.close(); G.scene="room"; return; }
      if(!carry.length) return;
      if(key==="ArrowLeft"){  G.ws.cursor=(G.ws.cursor+carry.length-1)%carry.length; SFX.move(); return; }
      if(key==="ArrowRight"){ G.ws.cursor=(G.ws.cursor+1)%carry.length; SFX.move(); return; }
      if(key==="c"){
        const k2=carryKey(carry[G.ws.cursor]);
        G.ws.on[k2]=!G.ws.on[k2];
        G.ws.on[k2]?SFX.open():SFX.close();
      }
      return;
    }

    case "place": {
      const v=G.view, e=v.sel[v.cursor];
      if(key==="x"||key==="Escape"){ SFX.close(); G.scene="room"; return; }
      if(key==="ArrowLeft"){  moveCursor(v,-1,0); return; }
      if(key==="ArrowRight"){ moveCursor(v, 1,0); return; }
      if(key==="ArrowUp"){    moveCursor(v, 0,-1); return; }
      if(key==="ArrowDown"){  moveCursor(v, 0, 1); return; }
      if(!e) return;
      if(key==="z"){
        if(e.t==="pile" || (e.t==="look" && e.peek)){ v.peek[e.li]=!v.peek[e.li]; SFX.open(); }
        else if(e.t==="box"){
          const kk=v.place+":"+e.li+":"+e.bi;
          G.day.opened[kk]=!G.day.opened[kk];
          G.day.opened[kk]?SFX.open():SFX.close();
        }
      }
      else if(key==="c" && actionC(e)){
        const ix=carryIdx(v.place,e.li,e.bi);
        if(ix>=0){ G.day.carry.splice(ix,1); SFX.close(); }        // 取った場所でだけ もどせる
        else {
          const need=VESSEL[G.day.store[v.place][e.li].cons[e.bi].shape].slots;
          if(carryUsed()+need<=CARRY_MAX){ G.day.carry.push({place:v.place,li:e.li,bi:e.bi}); SFX.open(); }
          else SFX.warn();
        }
      }
      return;
    }

    case "pc": {
      const p=G.pc;
      if(p.dialog){
        const d=p.dialog;
        if(key==="ArrowLeft"){ d.choice=0; SFX.move(); }
        if(key==="ArrowRight"){ d.choice=1; SFX.move(); }
        if(key==="Enter"||key==="z"){
          if(d.choice===0){ p.dialog=null; SFX.close(); G.scene="room"; }
          else { p.dialog=null; confirmRow(d.r); }
        }
        return;
      }
      if(key==="x"||key==="Escape"){ SFX.close(); G.scene="room"; return; }
      const rs=G.day.reqs;
      if(key==="ArrowUp"){ p.row=(p.row+rs.length-1)%rs.length; SFX.move(); }
      if(key==="ArrowDown"){ p.row=(p.row+1)%rs.length; SFX.move(); }

      const r=rs[p.row];
      if(key==="ArrowLeft"||key==="ArrowRight"){ stepValue(r,key==="ArrowLeft"?-1:1); }
      if((key==="Enter"||key==="z") && !G.day.confirmed[r.id]){
        const msg=warnsAt(G.day.inputs[r.id], r.theo);
        if(msg){ p.dialog={r,msg,choice:0}; SFX.warn(); }
        else confirmRow(r);
      }
      return;
    }

    case "result":
      if(key==="Enter"||key==="z"){ SFX.tick(); G.scene="title"; }
      return;
  }
}

function drawPlace(){
  const v=G.view, place=PLACES[v.place], lots=G.day.store[v.place];
  const cold=(v.place==="freezer"), warm=(v.place==="shelf"||v.place==="backshelf");
  rr(0,0,W,H, cold?"#0d1218":warm?"#171a24":"#0f1118");

  const bx=40, by=60, bw=W-80, bh=400;
  if(warm){
    rr(bx-10,by-10,bw+20,bh+20,C.woodLo); rr(bx,by,bw,bh,"#6b4e30"); ro(bx,by,bw,bh,"#3e2c1a",3);
  } else if(v.place==="prep"){
    rr(bx,by,bw,bh,"#1c2028"); ro(bx,by,bw,bh,"#101218",3);
  } else {
    rr(bx-12,by-12,bw+24,bh+24,C.steelLo); rr(bx-6,by-6,bw+12,bh+12,cold?"#c8d4de":"#c2c8d2");
    rr(bx,by,bw,bh,cold?"#18242c":"#1b242e"); ro(bx,by,bw,bh,"#0c1218",3);
    for(let i=0;i<40;i++) rr(bx+3,by+3+i,bw-6,1,
      "rgba("+(cold?"180,224,240":"130,190,210")+","+(0.12-i*0.0027)+")");
  }
  txt(place.label,W/2,32,{size:19,color:cold?"#a8d8e8":warm?C.mikan[300]:C.wasabi[300],
      bold:true,align:"center"});

  const hasWeigh=lots.some(l=>l.kind==="weigh"), scaleH=0;
  v.rects={};

  // 段に割り振る。1段に1〜2ロット置いて、縦にも横にも並ぶようにする
  const nLv = Math.min(3, Math.max(2, Math.ceil(lots.length/1.5)));
  const per = Math.ceil(lots.length/nLv);
  const levels=[];
  for(let i=0;i<lots.length;i+=per){
    levels.push(lots.slice(i,i+per).map((lot,j)=>({lot, li:i+j})));
  }
  const top=by+12+scaleH, lvH=(bh-22-scaleH)/levels.length;

  levels.forEach((row,ri)=>{
    const ly=top+ri*lvH, boardY=Math.round(ly+lvH-26);
    rr(bx+8,boardY,bw-16,8, warm?C.woodLo:C.steelLo);
    if(!warm) rr(bx+8,boardY,bw-16,3,C.steelHi);
    const availH=lvH-38, slotW=(bw-24)/row.length;
    row.forEach((cell,ci)=>{
      const sx=bx+12+ci*slotW;
      const item=CATALOG.find(i=>i.id===cell.lot.itemId);
      if(ci>0) rr(sx-2,ly+4,1,lvH-32,"rgba(255,255,255,0.06)");
      drawLot(cell.lot,item,sx+6,slotW-12,boardY,cell.li,v,availH);
      txt(item.name,sx+slotW/2,boardY+10,
          {size:14,color:warm?"#eadcbe":C.sumi[300],align:"center"});
    });
  });

  // いま選んでいるものを四角でかこみ、できることをボタンで出す
  const e=v.sel[v.cursor], rc=e&&v.rects[selKey(e)];
  if(rc){
    ro(rc.x-6,rc.y-6,rc.w+12,rc.h+12,C.mikan[300],3);
    const acts=[["Z",actionZ(e)],["C",actionC(e)]].filter(a=>a[1]);
    const ws=acts.map(a=>buttonW(a[1])), total=ws.reduce((a,b)=>a+b,0)+(acts.length-1)*10;
    let run=rc.x+rc.w/2-total/2;
    acts.forEach((a,i)=>{ drawActionButton(run+ws[i]/2, Math.max(44, rc.y-44), a[1], a[0]); run+=ws[i]+10; });
  }
  drawKeyHints([["↑↓←→","えらぶ"],["X","とじる"]],H-34);
}

function mark(v,key,x,y,w,h){ v.rects[key]={x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)}; }

function drawLot(lot,item,sx,sw,base,li,v,availH){
  if(lot.kind==="pieces"||lot.kind==="frozen"){
    const n=lot.pieces;
    const rows=n>5?2:1, cols=Math.ceil(n/rows);
    // 同じ列のなかでは かさねない。入りきらないときは小さくする
    let bw2=Math.max(10,Math.min(64,Math.floor((sw-12)/(cols+(rows>1?0.5:0)))-5));
    let bh2=Math.round(bw2*1.35);
    // 奥の列は、ふだんでも上半分が見える。奥を見ると ほとんど丸ごと見える
    const need=bh2+(rows-1)*Math.round(bh2*0.95);    // 持ち上げた状態でも段に収まる大きさにする
    if(need>availH){
      const kk=availH/need;
      bw2=Math.max(10,Math.floor(bw2*kk)); bh2=Math.round(bw2*1.35);
    }
    const lift=Math.round(bh2*(v.peek[li]?0.95:0.52));
    const step=bw2+5, back=rows>1?Math.round(step*0.5):0;
    const clusterW=(cols-1)*step+bw2+back, ox=(sw-clusterW)/2;
    for(let r=rows-1;r>=0;r--){          // 奥の列から描いて、手前が重なるようにする
      for(let c=0;c<cols;c++){
        const i=r*cols+c; if(i>=n) continue;
        if(DBG_SKIP===i) continue;
        const jy=Math.round((jit(li*11+i,5)-0.5)*4);
        const x=sx+ox+c*step+(r?back:0);
        const y=base-bh2-r*lift+jy;
        if(item.shape==="carton") drawCarton(x,y,bw2,bh2,item.color);
        else drawBag(x,y,bw2,bh2,item.color,lot.kind==="frozen");
      }
    }
    mark(v,"look:"+li+":0",sx+ox-6,base-bh2-(rows-1)*lift-8,clusterW+12,bh2+(rows-1)*lift+12);
  } else if(lot.kind==="pile"){
    const n=lot.pieces;
    const crateW=Math.min(sw-10,Math.max(170,n*16+70)), crateX=sx+(sw-crateW)/2;
    const crateH=Math.min(34,Math.round(availH*0.3));
    if(carryIdx(v.place,li,0)>=0){                      // 抱えて持ち出している
      rr(crateX,base-crateH,crateW,crateH,"#5e6672");
      rr(crateX+2,base-crateH+2,crateW-4,crateH-4,"#79828f");
      ro(crateX,base-crateH,crateW,crateH,"#434a54",2);
      txt("もちだし中",crateX+crateW/2,base-crateH-20,{size:12,color:C.sumi[600],align:"center"});
      mark(v,"pile:"+li+":0",crateX,base-crateH-24,crateW,crateH+24);
      return;
    }
    // 層ごとに レーンを割りあてて、同じ層のなかでは かさならないようにする
    const inL=[0,0,0];
    for(let i=0;i<n;i++) inL[lot.layer[i]]++;
    const widest=Math.max(1,inL[0],inL[1],inL[2]);
    const lane=(crateW-20)/widest;
    let d=Math.max(8,Math.round(Math.min(item.shape==="ellipse"?48:42, lane-6)));
    let dh=Math.round(item.shape==="ellipse"?d*0.72:(item.shape==="pepper"?d*1.25:d));
    // 奥の層は ふだんでも半分ちかく見える。持ち上げた状態でも段に収まる大きさにする
    if(crateH+2*Math.round(dh*0.78)+dh>availH){
      const kk=Math.max(0.3,(availH-crateH)/(2*Math.round(dh*0.78)+dh));
      d=Math.max(8,Math.round(d*kk)); dh=Math.max(8,Math.round(dh*kk));
    }
    const lift=Math.round(dh*(v.peek[li]?0.78:0.46));
    const seen=[0,0,0];
    for(let L=2;L>=0;L--){
      for(let i=0;i<n;i++){
        if(lot.layer[i]!==L) continue;
        const kk=seen[L]++;
        if(DBG_SKIP===i) continue;
        const sz=1+(jit(li*13+i,9)-0.5)*0.14;
        const ww=Math.round(d*sz), hh=Math.round(dh*sz);
        const slot=(crateW-20)/inL[L];
        const jx=Math.round((jit(li*5+i,1)-0.5)*Math.max(0,slot-ww-2));
        const x=crateX+10+Math.round(kk*slot+(slot-ww)/2)+jx;
        const y=base-crateH+6-hh-L*lift-Math.round(jit(li*3+i,7)*2);
        drawVeg(item.shape,x,y,ww,hh,item.color);
      }
    }
    rr(crateX,base-crateH,crateW,crateH,"#5e6672");             // コンテナ
    rr(crateX+2,base-crateH+2,crateW-4,crateH-4,"#79828f");
    for(let i=0;i<5;i++) rr(crateX+8+i*((crateW-16)/5),base-crateH+6,4,crateH-12,"#5e6672");
    ro(crateX,base-crateH,crateW,crateH,"#434a54",2);
    mark(v,"pile:"+li+":0",crateX,base-crateH+6-dh-2*lift-4,crateW,crateH+2*lift+dh+10);
  } else if(lot.kind==="liquid"){
    const n=lot.cans.length;
    let bh2=Math.min(100,availH-4), bw2=Math.round(bh2*0.52);
    let step=bw2+7;
    if((n-1)*step+bw2>sw-8){
      bw2=Math.max(16,Math.floor((sw-8-(n-1)*7)/n)); bh2=Math.round(bw2/0.52); step=bw2+7;
      if(bh2>availH-4){ bh2=availH-4; }
    }
    const ox=(sw-((n-1)*step+bw2))/2;
    lot.cans.forEach((f,i)=>drawBottle(sx+ox+i*step+Math.round((jit(li+i,2)-0.5)*8),base-bh2,bw2,bh2,f,lot.canSize));
    mark(v,"look:"+li+":0",sx+ox-8,base-bh2-14,(n-1)*step+bw2+16,bh2+18);
  } else if(lot.kind==="boxes"){
    // 箱は大きいので重ねない。かならず一列に並べる
    const n=lot.boxes.length;
    let bw2=Math.min(110,Math.floor((sw-8)/n)-8);
    let bh2=Math.min(availH-6,Math.round(bw2*0.92));
    if(bw2<30){ bw2=Math.max(26,Math.floor((sw-8)/n)-4); bh2=Math.min(availH-6,Math.round(bw2*0.92)); }
    const step=bw2+8, clusterW=(n-1)*step+bw2, ox=(sw-clusterW)/2;
    for(let bi=0;bi<n;bi++){
      const x=sx+ox+bi*step, y=base-bh2;
      const open=!!G.day.opened[v.place+":"+li+":"+bi];
      drawBox(x,y,bw2,bh2,open,lot.boxes[bi],item.color);
      mark(v,"box:"+li+":"+bi,x,y,bw2,bh2);
    }
  } else if(lot.kind==="weigh"){
    const n=lot.cons.length;
    const FW={tupper:[0.82,1.0,1.16], vat:[0.92,1.06,1.2], pot:[1.5,1.7,1.9]};
    const FH={tupper:0.80, vat:0.62, pot:0.80};
    const unit=Math.min(126,Math.floor((sw-16)/(n+0.9)));
    let ws=lot.cons.map(c=>Math.round(unit*FW[c.shape][c.size]));
    let totalW=ws.reduce((a,b)=>a+b,0)+(n-1)*10;
    if(totalW>sw-8){ const kk=(sw-8)/totalW; ws=ws.map(w2=>Math.max(14,Math.round(w2*kk))); }
    let hs=lot.cons.map((c,i)=>Math.round(ws[i]*FH[c.shape]));
    const maxH=Math.max.apply(null,hs);
    if(maxH>availH-8){ const kk=(availH-8)/maxH; hs=hs.map(h2=>Math.max(12,Math.round(h2*kk))); }
    totalW=ws.reduce((a,b)=>a+b,0)+(n-1)*10;
    let run=0; const ox=(sw-totalW)/2;
    lot.cons.forEach((c,ci)=>{
      const bw2=ws[ci], bh2=hs[ci], x=sx+ox+run, y=base-bh2; run+=bw2+10;
      const held=carryIdx(v.place,li,ci)>=0;
      if(held){
        rr(x,base-7,bw2,7,"rgba(0,0,0,0.42)");
        txt("もちだし中",x+bw2/2,base-26,{size:12,color:C.sumi[600],align:"center"});
      } else if(c.shape==="tupper") drawBowl(x,y,bw2,bh2,item.color,c.tare,false);
      else if(c.shape==="vat")      drawVat(x,y,bw2,bh2,c.fill,c.tare,item.color);
      else                          drawPot(x,y,bw2,bh2,c.fill,c.tare,item.color);
      mark(v,"con:"+li+":"+ci,x,held?base-30:(y-20),bw2,held?30:(bh2+20));
    });
  }
}

let DBG_SKIP=-1;
// 位置や大きさを不ぞろいにするための、決まった値を返すゆらぎ
const jit=(a,b)=>{ const v=Math.sin(a*12.9898+b*78.233)*43758.5453; return v-Math.floor(v); };
// よこ方向の幅の変化を帯で積んで、丸いものをドット絵らしく描く
function blob(x,y,w,h,col,prof){
  const n=Math.max(5,Math.round(h/4));
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n, ww=Math.max(2,Math.round(w*prof(t)));
    rr(Math.round(x+(w-ww)/2), Math.round(y+h*i/n), ww, Math.ceil(h/n)+1, col);
  }
}
const PROF={
  round:  t=>Math.sqrt(Math.max(0,1-Math.pow(2*t-1,2))),
  ellipse:t=>Math.sqrt(Math.max(0,1-Math.pow(2*t-1,2)))*0.98,
  pepper: t=>t<0.18?0.52+t*1.6:(t<0.62?0.80+(t-0.18)*0.45:1.0-(t-0.62)*0.55),
};
function shade(c,k){                       // ざっくり明暗
  const n=parseInt(c.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));
  return "rgb("+f(n>>16&255)+","+f(n>>8&255)+","+f(n&255)+")";
}
function drawVeg(shape,x,y,w,h,col){
  if(shape==="pepper"){
    blob(x,y+5,w,h-5,shade(col,0.72),PROF.pepper);
    blob(x+1,y+5,w-3,h-7,col,PROF.pepper);
    blob(x+3,y+8,Math.round(w*0.42),Math.round((h-10)*0.7),shade(col,1.3),PROF.pepper);
    rr(x+Math.round(w*0.42),y,Math.max(2,Math.round(w*0.16)),7,"#3f6b34");   // へた
    rr(x+Math.round(w*0.3),y+4,Math.max(3,Math.round(w*0.4)),4,"#4a7a3c");
  } else {
    const prof=PROF[shape]||PROF.round;
    blob(x,y,w,h,shade(col,0.74),prof);
    blob(x+1,y+1,w-2,h-2,col,prof);
    blob(x+Math.round(w*0.14),y+Math.round(h*0.14),Math.round(w*0.34),Math.round(h*0.3),shade(col,1.28),prof);
    if(shape==="round") rr(x+Math.round(w*0.46),y,Math.max(2,Math.round(w*0.1)),4,"#4a7a3c");
  }
}
function drawCarton(x,y,w,h,col){
  rr(x,y,w,h,shade(col,0.82)); rr(x+2,y+2,w-4,h-4,col);
  rr(x,y,w,Math.max(3,Math.round(h*0.14)),"#ffffffcc");
  for(let i=1;i<3;i++) rr(x+Math.round(w*i/3),y+Math.round(h*0.3),1,Math.round(h*0.6),shade(col,0.8));
  rr(x+Math.round(w*0.18),y+Math.round(h*0.45),Math.round(w*0.64),Math.round(h*0.22),"#fdfdfd");
}
function drawBag(x,y,w,h,col,frost){
  rr(x,y,w,h,col); rr(x,y,w,Math.max(3,h*0.12),"#ffffffcc"); ro(x,y,w,h,"#00000055",2);
  rr(x+w*0.2,y+h*0.42,w*0.6,h*0.2,"#fdfdfd");
  if(frost){
    rr(x,y,w,h,"rgba(226,240,248,0.44)");
    for(let i=0;i<7;i++) rr(x+((i*37)%(w-4)),y+((i*53)%(h-4)),3,3,"rgba(255,255,255,0.75)");
  }
}
function drawBottle(x,y,w,h,fill,size){
  const GLASS="#3f3418",GLASS_D="#2a2210",LIQ="#9c7c28";
  const cx=x+w/2, neckW=Math.round(w*0.30), neckH=Math.round(h*0.22), shH=Math.round(h*0.15);
  const bodyY=y+neckH+shH, bodyH=h-neckH-shH;
  rr(cx-neckW/2-3,y-9,neckW+6,11,"#9c2f2a"); rr(cx-neckW/2-3,y-9,neckW+6,3,"#c4514a");
  rr(cx-neckW/2,y,neckW,neckH+2,GLASS);
  for(let i=0;i<5;i++){
    const ww=Math.round(neckW+(w-neckW)*((i+1)/5));
    rr(cx-ww/2,y+neckH+Math.round(shH*i/5),ww,Math.ceil(shH/5)+1,GLASS);
  }
  rr(x,bodyY,w,bodyH,GLASS);
  const fh=Math.round((bodyH-8)*fill);
  rr(x+3,bodyY+bodyH-4-fh,w-6,fh,LIQ);
  rr(x+3,bodyY+bodyH-4-fh,w-6,2,"#b89440");
  maxLine(x+3,bodyY+4,w-6,"#ffffff66");        // いっぱいの線
  rr(x+4,bodyY+4,4,bodyH-12,"rgba(255,245,210,0.13)");
  ro(x,bodyY,w,bodyH,GLASS_D,2);
  rr(x+3,y+neckH-2,w-6,18,"#efe9d8"); ro(x+3,y+neckH-2,w-6,18,"#a89c80",2);
  txt(num(size)+"L",cx,y+neckH+1,{size:13,color:"#2c2c30",bold:true,align:"center"});
}
function drawBox(x,y,w,h,open,contents,col){
  if(!open){
    rr(x,y,w,h,"#b08c5e"); rr(x+2,y+2,w-4,h-4,"#c89c6a"); rr(x,y,w,8,"#9a7a50");
    rr(x+w/2-1,y+8,2,h-8,"#a8864e");
    rr(x+10,y+h/2-10,w-20,20,"#eee4d0");
  } else {
    rr(x-6,y-13,w/2+5,15,"#9a7a50"); rr(x+w/2+1,y-13,w/2+5,15,"#9a7a50");
    rr(x,y,w,h,"#8a6a44"); rr(x+5,y+5,w-10,h-10,"#2e2518");
    if(contents===0){
      txt("からっぽ",x+w/2,y+h/2-9,{size:15,color:C.sumi[500],align:"center"});
    } else {
      const per=3, rows=Math.ceil(contents/per);
      const bw2=Math.floor((w-18)/per);
      const bh2=Math.max(9,Math.min(24,Math.floor((h-20)/rows)-3));
      for(let i=0;i<contents;i++){
        const r=Math.floor(i/per), c=i%per;
        const px=x+9+c*bw2+(r%2?4:0), py=y+h-10-bh2-r*(bh2+3);
        rr(px,py,bw2-3,bh2,col); rr(px,py,bw2-3,2,"#ffffffbb"); ro(px,py,bw2-3,bh2,"#00000055",2);
      }
    }
  }
}
// いっぱいまで入れたときの高さを示す線
function maxLine(x,y,w,col){
  for(let i=0;i<w;i+=7) rr(x+i,y,4,2,col||"#ffffffb0");
}
function drawVat(x,y,w,h,fill,tare,col){
  rr(x,y,w,h,"#aab0ba"); rr(x+4,y+4,w-8,h-8,"#5c626c");
  const fh=Math.round((h-14)*fill);
  rr(x+5,y+h-5-fh,w-10,fh,col||"#a8742c"); rr(x+5,y+h-5-fh,w-10,3,"#ffffff55");
  maxLine(x+5,y+9,w-10);                       // いっぱいの線
  ro(x,y,w,h,"#474d56",3);
  if(tare && w>=58){
    rr(x+w/2-34,y-15,68,13,"#f4f1e6"); ro(x+w/2-34,y-15,68,13,"#b8b2a2",2);
    txt("空 "+comma(tare)+"g",x+w/2,y-14,{size:10,color:"#2c2c30",bold:true,align:"center"});
  }
}
function drawPot(x,y,w,h,fill,tare,col){
  const hw=Math.max(8,Math.round(w*0.12));
  rr(x-hw,y+Math.round(h*0.18),hw,Math.round(h*0.1),"#8a9098");
  rr(x+w,y+Math.round(h*0.18),hw,Math.round(h*0.1),"#8a9098");
  rr(x,y,w,h,"#9aa0aa"); rr(x+5,y+7,w-10,h-12,"#3a3026");
  const fh=Math.round((h-24)*fill);
  rr(x+6,y+h-6-fh,w-12,fh,col||"#a8742c"); rr(x+6,y+h-6-fh,w-12,3,"#ffffff55");
  maxLine(x+6,y+18,w-12);                      // いっぱいの線
  ro(x,y,w,h,"#5a6069",3);
  if(tare && w>=84){
    rr(x+w/2-47,y-18,94,15,"#f4f1e6"); ro(x+w/2-47,y-18,94,15,"#b8b2a2",2);
    txt("空のとき "+comma(tare)+"g",x+w/2,y-17,{size:11,color:"#2c2c30",bold:true,align:"center"});
  }
}
// 抱えてきた野菜。容器がないので、はかりの上では そのまま積まれる
function drawVegHeap(x,y,w,h,col,shape,n){
  const cols=Math.min(n,Math.max(3,Math.round(Math.sqrt(n*1.8))));
  const d=Math.max(7,Math.min(Math.floor((w-6)/cols), Math.floor(h/1.9)));
  const rows=Math.ceil(n/cols);
  for(let r=rows-1;r>=0;r--){
    const inR=Math.min(cols,n-r*cols), cw=inR*d, ox=(w-cw)/2;
    for(let c=0;c<inR;c++)
      drawVeg(shape||"round",x+ox+c*d,y+h-d-r*Math.round(d*0.52),d,d,col);
  }
}

    drawKeyHints([["X","もどる"]],H-34);

    rr(x,y,cw,86, on?"#13261f":"#1a1e28"); ro(x,y,cw,86, on?C.wasabi[500]:"#333a46",2);
    if(o.shape==="tupper") drawBowl(x+28,y+10,cw-56,48,item.color,o.tare,false);

  [["せいかくさ",r.accuracy+" %",r.accuracy>=80?C.wasabi[300]:C.mikan[300]],
   ["スキップりつ",r.skipRate+" %",r.skipRate>0?C.tarako[300]:C.wasabi[300]],
   ["しょようじかん",Math.floor(r.seconds/60)+"分"+(r.seconds%60)+"秒",C.white],
   ["あるいた きょり",r.walked+" ドット",C.sumi[400]],
  ].forEach((row,i)=>{
    const y=py+26+i*32;
    txt(row[0],qx,y+4,{size:15,color:C.sumi[500]});
    txt(row[1],W-40,y+2,{size:18,color:row[2],bold:true,align:"right"});
  });

  const by=py+26+r.detail.length*32+14;
  rr(40,by,W-80,44,"#1c1414"); ro(40,by,W-80,44,C.tarako[500],2);
  txt("ランク",60,by+13,{size:15,color:C.sumi[400]});
  txt(r.rank,120,by+7,{size:25,color:C.tarako[300],bold:true});
  txt(r.rank==="S"?"「完璧。ただし誰も見ていない」":r.rank==="A"?"「よく数えた」"
     :r.rank==="B"?"「まあ発注はできる」":"「とりあえず 発注は できる」",
     160,by+13,{size:17,color:C.sumi[300]});

  txt("あしたも きます。",W/2,by+70,{size:20,color:C.mikan[300],bold:true,align:"center"});
  txt("— これが 毎日 おきている —",W/2,by+100,{size:16,color:C.sumi[500],align:"center"});
  drawKeyHints([["Enter","タイトルへ"]],H-34);
}

/* =========================================================================
   メインループ
   ========================================================================= */
let prev=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-prev)/1000); prev=now; G.t+=dt;
  if(G.scene==="room") updateRoom(dt);
  if(G.scene==="pc") updatePC(dt);
  ctx.clearRect(0,0,W,H);
  switch(G.scene){
    case "title":    drawTitle(); break;
    case "briefing": drawBriefing(); break;
    case "room":     drawRoom(); break;
    case "place":    drawPlace(); drawHUD(); break;
    case "weighst":  drawWeighStation(); drawHUD(); break;
    case "pc":       drawPC(); break;
    case "result":   drawResult(); break;
  }
  requestAnimationFrame(frame);
}

G.save=loadSave();
cv.focus();
requestAnimationFrame(frame);
</script>
